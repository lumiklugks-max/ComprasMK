<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Layout da Vitrine */
        .catalogo-container {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 100px; /* Espaço para a barra flutuante */
        }
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card-produto {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }
        .card-produto:hover {
            border-color: #00d2ff;
        }
        .card-produto h3 {
            text-align: left;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }
        .card-produto p {
            text-align: left;
            margin-bottom: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .estoque-tag {
            font-size: 0.8rem;
            color: #a8a8b3;
            margin-bottom: 15px;
        }

        /* Controles de Quantidade (+ e -) */
        .controles-qtd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #121214;
            border-radius: 8px;
            padding: 8px 12px;
            border: 1px solid #29292e;
        }
        .btn-qtd {
            background: none;
            border: none;
            color: #00d2ff;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        .btn-qtd:hover {
            opacity: 0.7;
        }
        .numero-qtd {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            min-width: 30px;
            text-align: center;
        }

        /* Barra Flutuante Inferior de Confirmação */
        .barra-fixa-pedido {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #202024;
            border-top: 2px solid #29292e;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 999;
        }
        .barra-conteudo {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .contador-total-itens {
            font-size: 1rem;
            color: #a8a8b3;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="catalogo-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <span id="saudacao-cliente" style="color: #a8a8b3; font-weight: bold;">Carregando...</span>
            <button id="btn-sair" style="background: none; border: none; color: #ff4b2b; cursor: pointer; font-weight: bold; text-decoration: underline;">Sair</button>
        </div>

        <h1>🛍️ Nosso Catálogo</h1>
        <p style="text-align: center;">Escolha os itens desejados e defina a quantidade abaixo</p>

        <div class="grid-produtos" id="espaco-produtos">
            </div>
    </div>

    <div class="barra-fixa-pedido">
        <div class="barra-conteudo">
            <div class="contador-total-itens" id="texto-resumo">Nenhum item selecionado</div>
            <button class="btn-primary" id="btn-enviar-pedido" style="padding: 12px;">Confirmar Pedido 🚀</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, get, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let usuarioAtual = null;
    let dadosClienteExtra = null;
    let carrinhoLocal = {}; 

    // 1. VERIFICA LOGIN
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            usuarioAtual = user;
            
            const snapshot = await get(ref(db, 'usuarios/' + user.uid));
            if (snapshot.exists()) {
                dadosClienteExtra = snapshot.val();
                document.getElementById('saudacao-cliente').innerText = `Olá, ${dadosClienteExtra.nome} 👋`;
            } else {
                document.getElementById('saudacao-cliente').innerText = `Olá 👋`;
            }
            
            carregarProdutosDoCatalogo();
        } else {
            window.location.href = 'index.html';
        }
    });

    // 2. CARREGA E REDENRIZA OS PRODUTOS COM SEGURANÇA ANTICRASH
    function carregarProdutosDoCatalogo() {
        const produtosRef = ref(db, 'produtos');
        
        onValue(produtosRef, (snapshot) => {
            const container = document.getElementById('espaco-produtos');
            container.innerHTML = "";
            const produtos = snapshot.val();

            if (produtos) {
                Object.keys(produtos).forEach((id) => {
                    try {
                        const prod = produtos[id];
                        
                        // Proteção: Cria substitutos caso o produto seja do projeto antigo (incompleto)
                        const nomeProd = prod.nome || "Produto Sem Nome";
                        const descProd = prod.descricao || "Sem descrição preenchida.";
                        const estoqueProd = prod.estoque !== undefined ? parseInt(prod.estoque) : 0;

                        if (!carrinhoLocal[id]) carrinhoLocal[id] = 0;

                        const card = document.createElement('div');
                        card.className = 'card-produto';
                        card.innerHTML = `
                            <div>
                                <h3>${nomeProd}</h3>
                                <p>${descProd}</p>
                                <div class="estoque-tag">Disponível em estoque: <strong>${estoqueProd}</strong> un</div>
                            </div>
                            <div class="controles-qtd">
                                <button class="btn-qtd" onclick="alterarQuantidade('${id}', -1, ${estoqueProd})">-</button>
                                <span class="numero-qtd" id="qtd-${id}">${carrinhoLocal[id]}</span>
                                <button class="btn-qtd" onclick="alterarQuantidade('${id}', 1, ${estoqueProd})">+</button>
                            </div>
                        `;
                        container.appendChild(card);
                    } catch (err) {
                        console.error("Erro ao carregar um item específico:", err);
                    }
                });
            } else {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Nenhum produto disponível no catálogo.</p>";
            }
            atualizarBarraResumo();
        });
    }

    // 3. ALTERAR QUANTIDADE (Mudamos o nome da variável para evitar bugs de acentuação)
    window.alterarQuantidade = function(id, mudanca, limiteEstoque) {
        let qtdAtual = carrinhoLocal[id] || 0;
        let limiteNum = parseInt(limiteEstoque) || 0;
        let novaQtd = qtdAtual + mudanca;

        if (novaQtd < 0) return; 
        if (mudanca > 0 && novaQtd > limiteNum) {
            alert("Desculpe, não há mais unidades deste item em estoque.");
            return;
        }

        carrinhoLocal[id] = novaQtd;
        
        const elementoContador = document.getElementById(`qtd-${id}`);
        if (elementoContador) elementoContador.innerText = novaQtd;

        atualizarBarraResumo();
    };

    // 4. ATUALIZA BARRA INFERIOR
    function atualizarBarraResumo() {
        let totalItens = 0;
        Object.keys(carrinhoLocal).forEach(id => {
            totalItens += carrinhoLocal[id];
        });

        const textoResumo = document.getElementById('texto-resumo');
        if (totalItens === 0) {
            textoResumo.innerText = "Nenhum item selecionado";
        } else if (totalItens === 1) {
            textoResumo.innerText = "1 item selecionado";
        } else {
            textoResumo.innerText = `${totalItens} itens selecionados`;
        }
    }

    // 5. ENVIAR PEDIDO
    document.getElementById('btn-enviar-pedido').onclick = async function() {
        const itensDoPedido = [];
        const snapshotProdutos = await get(ref(db, 'produtos'));
        const bancoProdutos = snapshotProdutos.val();

        Object.keys(carrinhoLocal).forEach(id => {
            const qtd = carrinhoLocal[id];
            if (qtd > 0 && bancoProdutos && bancoProdutos[id]) {
                itensDoPedido.push({
                    nome: bancoProdutos[id].nome || "Item",
                    quantidade: qtd
                });
            }
        });

        if (itensDoPedido.length === 0) {
            alert("Selecione pelo menos 1 item antes de confirmar o pedido!");
            return;
        }

        try {
            const dataAtual = new Date();
            const dataFormatada = dataAtual.toLocaleDateString('pt-BR') + ' ' + dataAtual.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

            const novoPedidoRef = push(ref(db, 'pedidos'));
            await set(novoPedidoRef, {
                clienteId: usuarioAtual.uid,
                clienteNome: dadosClienteExtra ? dadosClienteExtra.nome : 'Não informado',
                clienteTelefone: dadosClienteExtra ? dadosClienteExtra.telefone : 'Não informado',
                clienteEmail: usuarioAtual.email,
                data: dataFormatada,
                itens: itensDoPedido,
                status: "Pendente"
            });

            alert("Pedido enviado com sucesso! 🎉");
            Object.keys(carrinhoLocal).forEach(id => { carrinhoLocal[id] = 0; });
            carregarProdutosDoCatalogo();

        } catch (error) {
            alert("Erro ao enviar o pedido: " + error.message);
        }
    };

    // SAIR
    document.getElementById('btn-sair').onclick = function() {
        signOut(auth).then(() => {
            window.location.href = 'index.html';
        });
    };
</script>
</body>
</html>
