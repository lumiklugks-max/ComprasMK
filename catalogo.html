<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Catálogo Comercial</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00d2ff;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #1f2833;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 300px;
            overflow: hidden;
            text-align: left;
            transition: transform 0.2s;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .card p {
            color: #c5c6c7;
            font-size: 13px;
            height: 40px;
            overflow: hidden;
        }
        .price {
            color: #00ff66;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0 5px 0;
        }
        .stock {
            color: #888888;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .btn-add {
            background-color: #00d2ff;
            color: #000000;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-add:hover {
            background-color: #00b4db;
        }
        /* Rodapé de Confirmação */
        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121212;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
        }
        .total-box {
            font-size: 14px;
        }
        .total-box span {
            color: #00ff66;
            font-size: 18px;
            font-weight: bold;
        }
        .btn-confirm {
            background-color: #00d2ff;
            color: #000000;
            border: none;
            padding: 12px 40px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <h1>🛒 Nosso Catálogo Comercial</h1>
    <p class="subtitle">Escolha seus itens favoritos e faça seus pedidos diretamente em nosso sistema</p>

    <div class="container" id="catalogo-container">
        <p id="loading-text">Buscando produtos no banco de dados...</p>
    </div>

    <div class="footer-cart">
        <div class="total-box">
            <div id="cart-status">Nenhum item selecionado</div>
            <div>Total: <span id="cart-total">R$ 0,00</span></div>
        </div>
        <button class="btn-confirm" id="btn-confirmar">Confirmar Pedido 🚀</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // CONFIGURAÇÃO DO SEU FIREBASE (Substitua pelos dados do seu console se necessário)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "comprasmk-241ae.firebaseapp.com",
            databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
            projectId: "comprasmk-241ae",
            storageBucket: "comprasmk-241ae.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Estado local do carrinho do usuário (Controla o item ativo)
        let carrinhoAtivo = {
            produtoId: null,
            quantidade: 0,
            precoUnitario: 0
        };

        const catalogoContainer = document.getElementById("catalogo-container");
        const cartStatus = document.getElementById("cart-status");
        const cartTotal = document.getElementById("cart-total");

        // 1. CARREGAR E RENDERIZAR PRODUTOS EM TEMPO REAL
        onValue(ref(db, "produtos"), (snapshot) => {
            if (snapshot.exists()) {
                catalogoContainer.innerHTML = ""; // Limpa o carregando...
                const produtos = snapshot.val();

                Object.keys(produtos).forEach((id) => {
                    const prod = produtos[id];
                    
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <img src="${prod.imagem || 'https://via.placeholder.com/300'}" alt="${prod.nome}">
                        <div class="card-content">
                            <h3>${prod.nome}</h3>
                            <p>${prod.descricao || ''}</p>
                            <div class="price">R$ ${prod.preco.toFixed(2).replace('.', ',')}</div>
                            <div class="stock">Disponível: ${prod.estoque} unidades</div>
                            <button class="btn-add" onclick="adicionarAoCarrinho('${id}', ${prod.preco})">
                                🛒 Adicionar ao Pedido
                            </button>
                        </div>
                    `;
                    catalogoContainer.appendChild(card);
                });
            } else {
                catalogoContainer.innerHTML = "<p>Nenhum produto cadastrado no Firebase.</p>";
            }
        });

        // REGRA 1: VALIDAR ESTOQUE ANTES DE ADICIONAR AO CARRINHO
        window.adicionarAoCarrinho = async function(produtoId, preco) {
            try {
                const snapshot = await get(ref(db, `produtos/${produtoId}`));
                if (!snapshot.exists()) return;

                const produto = snapshot.val();
                const estoqueAtual = produto.estoque || 0;

                // Validação de estoque esgotado / zerado
                if (estoqueAtual <= 0) {
                    alert("Desculpe, este produto está totalmente esgotado!");
                    return;
                }

                // Simulação simples: adicionando 1 unidade por clique
                const novaQuantidade = (carrinhoAtivo.produtoId === produtoId ? carrinhoAtivo.quantidade : 0) + 1;

                if (novaQuantidade > estoqueAtual) {
                    alert(`Limite atingido! Só existem ${estoqueAtual} unidades em estoque.`);
                    return;
                }

                // Atualiza o estado do carrinho na interface
                carrinhoAtivo.produtoId = produtoId;
                carrinhoAtivo.quantidade = novaQuantidade;
                carrinhoAtivo.precoUnitario = preco;

                const valorTotal = carrinhoAtivo.quantidade * carrinhoAtivo.precoUnitario;
                cartStatus.innerText = `${carrinhoAtivo.quantidade}x Item Selecionado`;
                cartTotal.innerText = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;

            } catch (error) {
                console.error("Erro ao processar estoque:", error);
            }
        };

        // REGRA 2: SUBTRAIR ESTOQUE DO BANCO AO CONFIRMAR PEDIDO
        document.getElementById("btn-confirmar").addEventListener("click", () => {
            if (!carrinhoAtivo.produtoId || carrinhoAtivo.quantidade === 0) {
                alert("Adicione pelo menos um item ao pedido antes de confirmar!");
                return;
            }

            const produtoId = carrinhoAtivo.produtoId;
            const qtdComprada = carrinhoAtivo.quantidade;
            const estoqueRef = ref(db, `produtos/${produtoId}/estoque`);

            // Executa a transação segura para diminuir o estoque
            runTransaction(estoqueRef, (currentEstoque) => {
                if (currentEstoque === null) return 0;
                const novoEstoque = currentEstoque - qtdComprada;
                return novoEstoque < 0 ? 0 : novoEstoque;
            })
            .then(() => {
                alert("Pedido confirmado com sucesso! Estoque atualizado.");
                // Limpa o carrinho após o sucesso
                carrinhoAtivo = { produtoId: null, quantidade: 0, precoUnitario: 0 };
                cartStatus.innerText = "Nenhum item selecionado";
                cartTotal.innerText = "R$ 0,00";
            })
            .catch((error) => {
                console.error("Erro ao decrementar estoque:", error);
            });
        });

        // REGRA 3: LIMPAR ITENS / ZERAR SELEÇÃO ATUAL
        // Permite ao usuário resetar a seleção atual do catálogo antes do envio
        window.limparSelecaoAtual = function() {
            carrinhoAtivo = { produtoId: null, quantidade: 0, precoUnitario: 0 };
            cartStatus.innerText = "Nenhum item selecionado";
            cartTotal.innerText = "R$ 0,00";
            alert("Seleção limpa!");
        };
    </script>
</body>
</html>
