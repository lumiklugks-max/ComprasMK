<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .catalogo-container {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 120px;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            margin-top: 20px;
        }
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card-produto {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }
        .card-produto:hover {
            border-color: #00d2ff;
        }
        .produto-conteudo-superior {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
        }
        .produto-detalhes {
            flex: 1;
        }
        .produto-imagem-container {
            width: 80px;
            height: 80px;
            background-color: #121214;
            border: 1px solid #29292e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .produto-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .produto-sem-img {
            font-size: 2rem;
        }
        .card-produto h3 {
            text-align: left;
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: #ffffff;
        }
        .card-produto p {
            text-align: left;
            margin: 0 0 12px 0;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #a8a8b3;
        }
        .estoque-tag {
            font-size: 0.8rem;
            color: #a8a8b3;
            margin-bottom: 6px;
        }
        .preco-tag {
            font-size: 1.15rem;
            color: #00d2ff;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .controles-qtd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #121214;
            border-radius: 8px;
            padding: 8px 12px;
            border: 1px solid #29292e;
        }
        .btn-qtd {
            background: none;
            border: none;
            color: #00d2ff;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        .btn-qtd:hover {
            opacity: 0.7;
        }
        .numero-qtd {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            min-width: 30px;
            text-align: center;
        }
        .barra-fixa-pedido {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #202024;
            border-top: 2px solid #29292e;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 999;
        }
        .barra-conteudo {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .contador-total-itens {
            font-size: 1rem;
            color: #a8a8b3;
            white-space: nowrap;
        }
        .valor-total-carrinho {
            font-size: 1.1rem;
            color: #ffffff;
            font-weight: bold;
        }
        .valor-total-carrinho span {
            color: #00e676;
        }
        .btn-primary {
            background-color: #00d2ff;
            color: #121214;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #00b5dc;
        }
    </style>
</head>
<body>

    <div class="catalogo-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%;">
            <span id="saudacao-cliente" style="color: #a8a8b3; font-weight: bold;">Olá, Cliente 👋</span>
            <div style="display: flex; gap: 15px; align-items: center;">
                <a href="meus_pedidos.html" style="color: #00d2ff; font-weight: bold; text-decoration: none; border: 1px solid #00d2ff; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem;">🛍️ Meus Pedidos</a>
                <button id="btn-sair" style="background: none; border: none; color: #ff4b2b; cursor: pointer; font-weight: bold; text-decoration: underline; font-size: 1rem;">Sair</button>
            </div>
        </div>

        <h1>🛍️ Nosso Catálogo</h1>

        <div class="grid-produtos" id="espaco-produtos">
            <p style="grid-column: 1/-1; text-align: center; color: #a8a8b3;">Buscando produtos no banco de dados...</p>
        </div>
    </div>

            <div class="valor-total-carrinho" id="container-preco-total"><span>Total:</span> R$ 0,00</div>
