<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Catálogo Comercial</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 100px; /* Espaço para a barra inferior não cobrir os produtos */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00d2ff;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #1f2833;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 300px;
            overflow: hidden;
            text-align: left;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .card p {
            color: #c5c6c7;
            font-size: 13px;
            height: 40px;
            overflow: hidden;
        }
        .price {
            color: #00ff66;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0 5px 0;
        }
        .stock {
            color: #888888;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .btn-add {
            background-color: #00d2ff;
            color: #000000;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-add:hover {
            background-color: #00b4db;
        }
        /* BARRA INFERIOR DO CARRINHO VOLTANDO A MOSTRAR OS ITENS */
        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121212;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #00d2ff;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }
        .cart-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .cart-items-list {
            font-size: 13px;
            color: #00d2ff;
            max-height: 40px;
            overflow-y: auto;
        }
        .total-box {
            font-size: 16px;
            font-weight: bold;
        }
        .total-box span {
            color: #00ff66;
        }
        .btn-confirm {
            background-color: #00d2ff;
            color: #000000;
            border: none;
            padding: 12px 40px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <h1>🛒 Nosso Catálogo Comercial</h1>
    <p class="subtitle">Escolha seus itens favoritos e defina a quantidade desejada abaixo</p>

    <div class="container" id="catalogo-container">
        <p id="loading-text">Buscando produtos no banco de dados...</p>
    </div>

    <div class="footer-cart">
        <div class="cart-details">
            <div class="total-box">Total: <span id="cart-total">R$ 0,00</span></div>
            <div class="cart-items-list" id="cart-items-summary">Nenhum item selecionado</div>
        </div>
        <button class="btn-confirm" id="btn-confirmar">Confirmar Pedido 🚀</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, runTransaction, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Substitua pelas chaves do seu projeto se necessário
        const firebaseConfig = {
            authDomain: "comprasmk-241ae.firebaseapp.com",
            databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
            projectId: "comprasmk-241ae",
            storageBucket: "comprasmk-241ae.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Estrutura interna para guardar múltiplos produtos selecionados na sessão atual
        let carrinho = {}; 
        let listaProdutosBanco = {}; // Cópia local para validações rápidas

        const catalogoContainer = document.getElementById("catalogo-container");
        const cartTotal = document.getElementById("cart-total");
        const cartItemsSummary = document.getElementById("cart-items-summary");

        // 1. CARREGA PRODUTOS E ATUALIZA A TELA SEMPRE QUE MUDAR NO FIREBASE
        onValue(ref(db, "produtos"), (snapshot) => {
            if (snapshot.exists()) {
                catalogoContainer.innerHTML = "";
                listaProdutosBanco = snapshot.val();

                Object.keys(listaProdutosBanco).forEach((id) => {
                    const prod = listaProdutosBanco[id];
                    
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <img src="${prod.imagem || 'https://via.placeholder.com/300'}" alt="${prod.nome}">
                        <div class="card-content">
                            <h3>${prod.nome}</h3>
                            <p>${prod.descricao || ''}</p>
                            <div class="price">R$ ${prod.preco.toFixed(2).replace('.', ',')}</div>
                            <div class="stock">Disponível: ${prod.estoque} unidades</div>
                            <button class="btn-add" onclick="adicionarProduto('${id}')">
                                🛒 Adicionar ao Pedido
                            </button>
                        </div>
                    `;
                    catalogoContainer.appendChild(card);
                });
                atualizarInterfaceCarrinho();
            } else {
                catalogoContainer.innerHTML = "<p>Nenhum produto no banco.</p>";
            }
        });

        // REGRA 1: ADICIONAR AO CARRINHO COM VALIDAÇÃO DE ESTOQUE ATIVA
        window.adicionarProduto = function(produtoId) {
            const produtoInfo = listaProdutosBanco[produtoId];
            if (!produtoInfo) return;

            const estoqueDisponivel = produtoInfo.estoque || 0;

            if (estoqueDisponivel <= 0) {
                alert("Aviso: Este produto está totalmente esgotado!");
                return;
            }

            const quantidadeAtualNoCarrinho = carrinho[produtoId] ? carrinho[produtoId].quantidade : 0;
            const novaQuantidade = quantidadeAtualNoCarrinho + 1;

            if (novaQuantidade > estoqueDisponivel) {
                alert(`Quantidade limite atingida! Só existem ${estoqueDisponivel} unidades disponíveis.`);
                return;
            }

            // Grava ou incrementa o item no objeto do carrinho
            carrinho[produtoId] = {
                nome: produtoInfo.nome,
                quantidade: novaQuantidade,
                precoUnitario: produtoInfo.preco
            };

            atualizarInterfaceCarrinho();
        };

        // ATUALIZA A LISTAGEM VISUAL DE PRODUTOS SELECIONADOS NO RODAPÉ
        function atualizarInterfaceCarrinho() {
            const chaves = Object.keys(carrinho);
            
            if (chaves.length === 0) {
                cartItemsSummary.innerText = "Nenhum item selecionado";
                cartTotal.innerText = "R$ 0,00";
                return;
            }

            let textoResumo = "Selecionados: ";
            let valorTotalGeral = 0;

            chaves.forEach((id) => {
                const item = carrinho[id];
                textoResumo += `[${item.quantidade}x ${item.nome}] `;
                valorTotalGeral += item.quantidade * item.precoUnitario;
            });

            cartItemsSummary.innerText = textoResumo;
            cartTotal.innerText = `R$ ${valorTotalGeral.toFixed(2).replace('.', ',')}`;
        }

        // REGRA 2: CONFIRMAR COMPRA, GRAVAR PEDIDO E REDUZIR CADA ESTOQUE NO FIREBASE
        document.getElementById("btn-confirmar").addEventListener("click", async () => {
            const itensIds = Object.keys(carrinho);
            if (itensIds.length === 0) {
                alert("Seu carrinho está vazio! Selecione produtos antes de confirmar.");
                return;
            }

            try {
                // 1. Gera e salva o novo pedido dentro do nó 'pedidos' do Firebase
                const novosPedidosRef = ref(db, "pedidos");
                const novoPedidoIdRef = push(novosPedidosRef);
                
                let valorTotalGeral = 0;
                let itensParaSalvar = {};

                itensIds.forEach((id) => {
                    const item = carrinho[id];
                    valorTotalGeral += item.quantidade * item.precoUnitario;
                    itensParaSalvar[id] = {
                        quantidade: item.quantidade,
                        precoUnitario: item.precoUnitario
                    };
                });

                await set(novoPedidoIdRef, {
                    itens: itensParaSalvar,
                    total: valorTotalGeral,
                    status: "pendente",
                    data: new Date().toISOString()
                });

                // 2. Diminui o estoque correspondente de cada produto comprado via runTransaction
                for (const id of itensIds) {
                    const qtdComprada = carrinho
