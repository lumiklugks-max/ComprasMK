<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Catálogo Comercial</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 120px; /* Espaço para o rodapé */
        }
        /* BARRA SUPERIOR ORIGINAL DE NAVEGAÇÃO */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #121212;
            border-bottom: 1px solid #222;
        }
        .user-status {
            font-size: 14px;
            color: #aaaaaa;
        }
        .nav-buttons a {
            text-decoration: none;
            font-weight: bold;
            margin-left: 15px;
            font-size: 14px;
        }
        .btn-pedidos { color: #00d2ff; }
        .btn-sair { color: #ff4d4d; }

        header {
            text-align: center;
            margin: 40px 0 20px 0;
        }
        header h1 {
            color: #00d2ff;
            margin: 0 0 5px 0;
        }
        header p {
            color: #aaaaaa;
            font-size: 14px;
            margin: 0;
        }

        /* CONTEÚDO E CARDS */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #1f2833;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 300px;
            overflow: hidden;
            text-align: left;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #ffffff;
        }
        .card p {
            color: #c5c6c7;
            font-size: 13px;
            height: 40px;
            overflow: hidden;
            margin: 0 0 15px 0;
        }
        .price {
            color: #00ff66;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stock {
            color: #888888;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .btn-add {
            background-color: #00d2ff;
            color: #000000;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover { background-color: #00b4db; }

        /* RODAPÉ DO CARRINHO ORIGINAL E DINÂMICO */
        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121212;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #00d2ff;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .cart-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .cart-summary {
            font-size: 13px;
            color: #00d2ff;
            font-style: italic;
        }
        .total-box {
            font-size: 15px;
            color: #ffffff;
        }
        .total-box span {
            color: #00ff66;
            font-size: 18px;
            font-weight: bold;
        }
        .btn-confirm {
            background-color: #00d2ff;
            color: #000000;
            border: none;
            padding: 12px 40px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-confirm:hover { background-color: #00b4db; }
        
        #loading-text {
            color: #aaaaaa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="user-status">Acessando Catálogo... 👋</div>
        <div class="nav-buttons">
            <a href="meus_pedidos.html" class="btn-pedidos">📋 Meus Pedidos</a>
            <a href="index.html" class="btn-sair">Sair</a>
        </div>
    </div>

    <header>
        <h1>🛍️ Nosso Catálogo</h1>
        <p>Escolha os itens desejados e defina a quantidade abaixo</p>
    </header>

    <div class="container" id="catalogo-container">
        <p id="loading-text">Buscando produtos no banco de dados...</p>
    </div>

    <div class="footer-cart">
        <div class="cart-info">
            <div class="cart-summary" id="cart-items-summary">Nenhum item selecionado</div>
            <div class="total-box">Total: <span id="cart-total">R$ 0,00</span></div>
        </div>
        <button class="btn-confirm" id="btn-confirmar">Confirmar Pedido 🚀</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, runTransaction, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // =========================================================================
        // IMPORTANTE: Insira aqui as credenciais exatas que estão no seu arquivo meus_pedidos.html
        // =========================================================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "comprasmk-241ae.firebaseapp.com",
            databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
            projectId: "comprasmk-241ae",
            storageBucket: "comprasmk-241ae.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let carrinho = {}; 
        let produtosDoBanco = {}; 

        const catalogoContainer = document.getElementById("catalogo-container");
        const cartTotal = document.getElementById("cart-total");
        const cartItemsSummary = document.getElementById("cart-items-summary");

        // BUSCA E ESCUTA A LISTA DE PRODUTOS DO FIREBASE
        onValue(ref(db, "produtos"), (snapshot) => {
            if (snapshot.exists()) {
                catalogoContainer.innerHTML = "";
                produtosDoBanco = snapshot.val();

                Object.keys(produtosDoBanco).forEach((id) => {
                    const prod = produtosDoBanco[id];
                    
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <img src="${prod.imagem || 'https://via.placeholder.com/300'}" alt="${prod.nome}">
                        <div class="card-content">
                            <h3>${prod.nome}</h3>
                            <p>${prod.descricao || ''}</p>
                            <div class="price">R$ ${prod.preco.toFixed(2).replace('.', ',')}</div>
                            <div class="stock">Disponível: ${prod.estoque} unidades</div>
                            <button class="btn-add" onclick="adicionarProduto('${id}')">
                                🛒 Adicionar ao Pedido
                            </button>
                        </div>
                    `;
                    catalogoContainer.appendChild(card);
                });
                atualizarInterfaceCarrinho();
            } else {
                catalogoContainer.innerHTML = "<p>Nenhum produto cadastrado na tabela 'produtos' do Firebase.</p>";
            }
        });

        // REGRA 1: ADICIONAR VALIDANDO SALDO/ESTOQUE
        window.adicionarProduto = function(produtoId) {
            const produto = produtosDoBanco[produtoId];
            if (!produto) return;

            const estoqueLivre = produto.estoque || 0;

            if (estoqueLivre <= 0) {
                alert("Aviso: Saldo zerado! Este item está completamente esgotado.");
                return;
            }

            const qtdNoCarrinho = carrinho[produtoId] ? carrinho[produtoId].quantidade : 0;
            const novaQtd = qtdNoCarrinho + 1;

            if (novaQtd > estoqueLivre) {
                alert(`Falta de estoque! Só restam ${estoqueLivre} unidades deste item.`);
                return;
            }

            carrinho[produtoId] = {
                nome: produto.nome,
                quantidade: novaQtd,
                precoUnitario: produto.preco
            };

            atualizarInterfaceCarrinho();
        };

        // MOSTRA COMPRA SELECIONADA ATUALIZADA EM TEMPO REAL NO RODAPÉ
        function atualizarInterfaceCarrinho() {
            const itensIds = Object.keys(carrinho);
            
            if (itensIds.length === 0) {
                cartItemsSummary.innerText = "Nenhum item selecionado";
                cartTotal.innerText = "R$ 0,00";
                return;
            }

            let resumoTexto = "No carrinho: ";
            let totalAcumulado = 0;

            itensIds.forEach((id) => {
                const item = carrinho[id];
                resumoTexto += `${item.quantidade}x ${item.nome} | `;
                totalAcumulado += item.quantidade * item.precoUnitario;
            });

            // Corta a última barra vertical sobressalente
            cartItemsSummary.innerText = resumoTexto.slice(0, -3);
            cartTotal.innerText = `R$ ${totalAcumulado.toFixed(2).replace('.', ',')}`;
        }

        // REGRA 2: ENVIAR PEDIDO E REDUZIR QUANTIDADES DO ESTOQUE
        document.getElementById("btn-confirmar").addEventListener("click", async () => {
            const itensIds = Object.keys(carrinho);
            if (itensIds.length === 0) {
                alert("Adicione produtos antes de confirmar seu pedido.");
                return;
            }

            try {
                // 1. Envia a estrutura da compra para a tabela 'pedidos' usada pelo seu meus_pedidos.html
                const pedidosRef = ref(db, "pedidos");
                const novoPedidoRef = push(pedidosRef);
                
                let totalPedido = 0;
                let itensSalvar = {};

                itensIds.forEach((id) => {
                    const item = carrinho[id];
                    totalPedido += item.whitespace * item.precoUnitario; // Conta base do total
                    totalPedido += item.quantidade * item.precoUnitario;
                    
                    itensSalvar[id] = {
                        quantidade: item.quantidade,
                        precoUnitario: item.precoUnitario,
                        nome: item.nome
                    };
                });

                await set(novoPedidoRef, {
                    itens: itensSalvar,
                    total: totalPedido,
                    status: "pendente",
                    data: new Date().toLocaleString('pt-BR')
                });

                // 2. Transação que subtrai o estoque de cada item comprado
                for (const id of itensIds) {
                    const qtdComprada = carrinho[id].quantidade;
                    const itemEstoqueRef = ref(db, `produtos/${id}/estoque`);

                    await runTransaction(itemEstoqueRef, (currentEstoque) => {
                        if (currentEstoque === null) return 0;
                        const resultado = currentEstoque - qtdComprada;
                        return resultado < 0 ? 0 : resultado;
                    });
                }

                alert("Pedido realizado com sucesso! O estoque foi alterado.");
                carrinho = {};
                atualizarInterfaceCarrinho();

            } catch (error) {
                console.error("Erro ao registrar compra:", error);
                alert("Falha ao salvar o pedido. Verifique sua conexão.");
            }
        });
    </script>
</body>
</html>
