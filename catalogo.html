<!DOCTYPE html>
<html lang="pt-BR" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Comercial Completo de Compras</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 20px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 3fr 1.2fr;
            gap: 25px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .header-catalogo {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1f2833;
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-catalogo h1 {
            color: #00d2ff;
            font-size: 28px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 5px;
            background-color: #1f2833;
            border: 1px solid #45f3ff33;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            background-color: #00d2ff;
            color: #000000;
        }

        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card-produto {
            background-color: #1f2833;
            border-radius: 12px;
            border: 1px solid #45f3ff1a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .card-produto:hover {
            transform: translateY(-4px);
        }

        .img-produto {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #0b0c10;
            margin-bottom: 15px;
        }

        .nome-produto {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .desc-produto {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 15px;
            height: 60px;
            overflow-y: auto;
            }

        .preco-produto {
            font-size: 20px;
            font-weight: bold;
            color: #00ff66;
            margin-bottom: 15px;
        }

        .estoque-badge {
            font-size: 12px;
            color: #00d2ff;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-adicionar {
            background-color: #00d2ff;
            color: #000000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-adicionar:hover { background-color: #00b4db; }
        .btn-adicionar:disabled {
            background-color: #333333;
            color: #888888;
            cursor: not-allowed;
        }

        .sidebar-carrinho {
            background-color: #1f2833;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #45f3ff1a;
            align-self: start;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .sidebar-carrinho h3 {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #00d2ff;
        }

        .item-carrinho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            background-color: #0b0c10;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .item-carrinho-botoes {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qtd-cart {
            background: none;
            border: 1px solid #45f3ff33;
            color: #00d2ff;
            width: 24px;
            height: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-qtd-cart:hover {
            background-color: #00d2ff;
            color: #000;
        }

        .total-carrinho {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        .form-checkout {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-checkout label {
            font-size: 13px;
            color: #c5c6c7;
        }

        .form-checkout select {
            background-color: #0b0c10;
            border: 1px solid #45f3ff33;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        .btn-finalizar {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-finalizar:hover { background-color: #00cc52; }
        .btn-finalizar:disabled {
            background-color: #333333;
            color: #888888;
            cursor: not-allowed;
        }

        .no-data {
            grid-column: span 3;
            text-align: center;
            color: #aaaaaa;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <div class="header-catalogo">
        <h1>🛒 Catálogo de Produtos</h1>
        <div class="nav-links">
            <a href="meus_pedidos.html">📋 Meus Pedidos</a>
        </div>
    </div>

    <div class="main-container">
        <div>
            <div class="grid-produtos" id="grid-produtos-container">
                <div class="no-data">Carregando catálogo de produtos...</div>
            </div>
        </div>

        <div class="sidebar-carrinho">
            <h3>🛒 Seu Carrinho</h3>
            <div id="lista-carrinho-itens">
                <p style="color: #aaa; font-style: italic; font-size: 14px;">O carrinho está vazio.</p>
            </div>
            
            <div class="total-carrinho">
                Total: <span id="txt-total-carrinho" style="color: #00ff66;">R$ 0,00</span>
            </div>

            <div class="form-checkout">
                <label for="checkout-pagamento">Método de Pagamento:</label>
                <select id="checkout-pagamento">
                    <option value="pix">Pix (À vista)</option>
                    <option value="dinheiro">Dinheiro</option>
                    <option value="credito">Cartão de Crédito</option>
                </select>

                <div id="wrapper-parcelas" style="display: none; flex-direction: column; gap: 5px; margin-top: 5px;">
                    <label for="checkout-parcelas">Parcelamento:</label>
                    <select id="checkout-parcelas">
                        <option value="1">1x sem juros</option>
                        <option value="2">2x sem juros</option>
                        <option value="3">3x sem juros</option>
                        <option value="4">4x sem juros</option>
                        <option value="5">5x sem juros</option>
                        <option value="6">6x sem juros</option>
                        <option value="7">7x (com taxa adicional)</option>
                        <option value="8">8x (com taxa adicional)</option>
                        <option value="9">9x (com taxa adicional)</option>
                        <option value="10">10x (com taxa adicional)</option>
                        <option value="11">11x (com taxa adicional)</option>
                        <option value="12">12x (com taxa adicional)</option>
                    </select>
                    <small id="alerta-taxa" style="color: #ffa500; font-size: 11px; display: none;"></small>
                </div>
            </div>

            <button class="btn-finalizar" id="btn-confirmar-pedido" disabled>Confirmar Pedido 🚀</button>
        </div>
    </div>

    <script type="module" class="notranslate" translate="no">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
            authDomain: "cadastroteste047.firebaseapp.com",
            databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
            projectId: "cadastroteste047",
            storageBucket: "cadastroteste047.appspot.com",
            appId: "1:908890693829:web:2bd31d2447e27507310ac"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- CONTROLE DE TAXAS DINÂMICAS ---
        let taxaAcrescimoConfig = 2.5; 

        onValue(ref(db, "configuracoes/taxaCredito"), (snapshot) => {
            if (snapshot.exists()) {
                taxaAcrescimoConfig = parseFloat(snapshot.val());
                atualizarCarrinhoVisual(); 
            }
        });

        // --- SESSÃO INTEGRADA DO USUÁRIO ---
        let emailUsuarioLogado = localStorage.getItem("usuarioLogadoEmail") || "";

        // --- GERENCIAMENTO DE PRODUTOS E CARRINHO ---
        const gridProdutos = document.getElementById("grid-produtos-container");
        const listaCarrinhoItens = document.getElementById("lista-carrinho-itens");
        const txtTotalCarrinho = document.getElementById("txt-total-carrinho");
        const selectMetodo = document.getElementById("checkout-pagamento");
        const wrapperParcelas = document.getElementById("wrapper-parcelas");
        const selectParcelas = document.getElementById("checkout-parcelas");
        const alertaTaxa = document.getElementById("alerta-taxa");
        const btnFecharPedido = document.getElementById("btn-confirmar-pedido");

        let cacheProdutos = {}; 
        let carrinhoLocal = []; 
        let primeiraCargaProdutos = true;

        onValue(ref(db, "produtos"), (snapshot) => {
            if(!gridProdutos) return;
            gridProdutos.innerHTML = "";
            cacheProdutos = {};

            if(!snapshot.exists()) {
                gridProdutos.innerHTML = `<div class="no-data">Nenhum produto disponível no estoque no momento.</div>`;
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const prodId = childSnapshot.key;
                const prodData = childSnapshot.val();
                cacheProdutos[prodId] = prodData;

                const card = document.createElement("div");
                card.className = "card-produto";

                const estoqueRestante = parseInt(prodData.estoque || 0, 10);
                const semEstoque = estoqueRestante <= 0;

                card.innerHTML = `
                    <div>
                        <img src="${prodData.imagem || 'https://via.placeholder.com/150'}" class="img-produto" alt="${prodData.nome}">
                        <div class="nome-produto">${prodData.nome}</div>
                        <div class="desc-produto">${prodData.descricao || 'Sem descrição cadastrada.'}</div>
                    </div>
                    <div>
                        <img src="" style="display:none;">
                        <div class="preco-produto">R$ ${parseFloat(prodData.preco || 0).toFixed(2).replace('.', ',')}</div>
                        <div class="estoque-badge">${semEstoque ? '❌ Esgotado' : `📦 Estoque: ${estoqueRestante} unid.`}</div>
                        <button class="btn-adicionar" data-id="${prodId}" ${semEstoque ? 'disabled' : ''}>
                            ${semEstoque ? 'Indisponível' : '🛒 Adicionar ao Carrinho'}
                        </button>
                    </div>
                `;

                if(!semEstoque) {
                    card.querySelector(".btn-adicionar").addEventListener("click", (e) => {
                        const id = e.target.getAttribute("data-id");
                        adicionarAoCarrinho(id);
                    });
                }

                gridProdutos.appendChild(card);
            });

            // Recupera o pedido em edição apenas uma única vez na inicialização dos dados
            if (primeiraCargaProdutos) {
                verificarPedidoEmEdicao();
                primeiraCargaProdutos = false;
            }

            atualizarCarrinhoVisual();
        });

        // --- SISTEMA DE CAPTURA DO PEDIDO PARA EDIÇÃO ---
        let pedidoEmEdicaoId = null;
        let itensOriginaisDoPedido = {}; 

        function verificarPedidoEmEdicao() {
            pedidoEmEdicaoId = localStorage.getItem("pedido_em_edicao_id");
            const itensSalvosRaw = localStorage.getItem("pedido_em_edicao_itens");
            const pagamentoSalvo = localStorage.getItem("pedido_em_edicao_pagamento");

            if (pedidoEmEdicaoId && itensSalvosRaw) {
                try {
                    itensOriginaisDoPedido = JSON.parse(itensSalvosRaw);
                    carrinhoLocal = [];

                    // Mapeia o objeto de itens do Firebase de volta para o Array do carrinhoLocal
                    Object.keys(itensOriginaisDoPedido).forEach((idItem) => {
                        const quantidadeOriginal = parseInt(itensOriginaisDoPedido[idItem].quantidade || itensOriginaisDoPedido[idItem].qtd || 1, 10);
                        carrinhoLocal.push({
                            id: idItem,
                            quantidade: quantidadeOriginal
                        });
                    });

                    // Aplica a forma de pagamento que estava salva
                    if (selectMetodo && pagamentoSalvo) {
                        selectMetodo.value = pagamentoSalvo;
                        if(pagamentoSalvo === "credito") {
                            wrapperParcelas.style.display = "flex";
                        }
                    }

                    // Muda estilização do botão para alertar alteração
                    if (btnFecharPedido) {
                        btnFecharPedido.innerText = "💾 Salvar Alterações do Pedido Pendente";
                        btnFecharPedido.style.backgroundColor = "#00d2ff";
                    }

                } catch (e) {
                    console.error("Erro ao estruturar dados do pedido em edição:", e);
                }
            }
        }

        function adicionarAoCarrinho(id) {
            const itemExistente = carrinhoLocal.find(item => item.id === id);
            let estoqueDisponivel = parseInt(cacheProdutos[id]?.estoque || 0, 10);

            // Se for modo edição, adiciona virtualmente o que já estava retido no pedido antigo
            if (pedidoEmEdicaoId && itensOriginaisDoPedido[id]) {
                estoqueDisponivel += parseInt(itensOriginaisDoPedido[id].quantidade || 0, 10);
            }

            if(itemExistente) {
                if(itemExistente.quantidade < estoqueDisponivel) {
                    itemExistente.quantidade += 1;
                } else {
                    alert("Desculpe, limite máximo atingido com base no estoque atual deste produto.");
                }
            } else {
                if(estoqueDisponivel > 0) {
                    carrinhoLocal.push({ id: id, quantidade: 1 });
                }
            }
            atualizarCarrinhoVisual();
        }

        function alterarQuantidadeCarrinho(id, delta) {
            const itemIndex = carrinhoLocal.findIndex(item => item.id === id);
            if(itemIndex === -1) return;

            let estoqueDisponivel = parseInt(cacheProdutos[id]?.estoque || 0, 10);
            
            if (pedidoEmEdicaoId && itensOriginaisDoPedido[id]) {
                estoqueDisponivel += parseInt(itensOriginaisDoPedido[id].quantidade || 0, 10);
            }

            carrinhoLocal[itemIndex].quantidade += delta;

            if(carrinhoLocal[itemIndex].quantidade <= 0) {
                carrinhoLocal.splice(itemIndex, 1);
            } else if(carrinhoLocal[itemIndex].quantidade > estoqueDisponivel) {
                carrinhoLocal[itemIndex].quantidade = estoqueDisponivel;
                alert("Ajustado automaticamente para o limite máximo do estoque disponível.");
            }

            atualizarCarrinhoVisual();
        }

        function atualizarOpcoesParcelamento(totalBase) {
            if(!selectParcelas) return;
            const parcelaSelecionadaOriginal = selectParcelas.value;
            selectParcelas.innerHTML = "";

            for(let i = 1; i <= 12; i++) {
                let valorTotalComTaxa = totalBase;
                let textoExtra = "sem juros";

                if(i > 6) {
                    const excedentes = i - 6;
                    valorTotalComTaxa = totalBase * (1 + ((taxaAcrescimoConfig / 100) * excedentes));
                    textoExtra = "com taxa adicional";
                }

                const valorParcela = valorTotalComTaxa / i;
                const opt = document.createElement("option");
                opt.value = i;
                opt.innerText = `${i}x de R$ ${valorParcela.toFixed(2).replace('.', ',')} (${textoExtra})`;
                
                selectParcelas.appendChild(opt);
            }
            if(parcelaSelecionadaOriginal) {
                selectParcelas.value = parcelaSelecionadaOriginal;
            }
        }

        function atualizarCarrinhoVisual() {
            if(!listaCarrinhoItens) return;
            listaCarrinhoItens.innerHTML = "";

            if(carrinhoLocal.length === 0) {
                listaCarrinhoItens.innerHTML = `<p style="color: #aaa; font-style: italic; font-size: 14px;">O carrinho está vazio.</p>`;
                txtTotalCarrinho.innerText = "R$ 0,00";
                ajustarEstadoBotaoFinalizar();
                return;
            }

            let totalBasePedido = 0;

            carrinhoLocal.forEach((item) => {
                const infoProd = cacheProdutos[item.id];
                if(!infoProd) return;

                const precoItem = parseFloat(infoProd.preco || 0);
                const subtotal = precoItem * item.quantidade;
                totalBasePedido += subtotal;

                const itemDiv = document.createElement("div");
                itemDiv.className = "item-carrinho";
                itemDiv.innerHTML = `
                    <div>
                        <strong>${infoProd.nome}</strong><br>
                        <span style="color:#00ff66;">R$ ${precoItem.toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="item-carrinho-botoes">
                        <button class="btn-qtd-cart btn-diminuir" data-id="${item.id}">-</button>
                        <span>${item.quantidade}</span>
                        <button class="btn-qtd-cart btn-aumentar" data-id="${item.id}">+</button>
                    </div>
                `;

                itemDiv.querySelector(".btn-diminuir").addEventListener("click", () => alterarQuantidadeCarrinho(item.id, -1));
                itemDiv.querySelector(".btn-aumentar").addEventListener("click", () => alterarQuantidadeCarrinho(item.id, 1));

                listaCarrinhoItens.appendChild(itemDiv);
            });

            atualizarOpcoesParcelamento(totalBasePedido);

            let valorFaturadoFinal = totalBasePedido;
            if (selectMetodo && selectMetodo.value === "credito") {
                const numParcelas = parseInt(selectParcelas.value || 1, 10);
                if(numParcelas > 6) {
                    const excedentes = numParcelas - 6;
                    valorFaturadoFinal = totalBasePedido * (1 + ((taxaAcrescimoConfig / 100) * excedentes));
                    if(alertaTaxa) {
                        const valorParcelado = valorFaturadoFinal / numParcelas;
                        alertaTaxa.style.display = "block";
                        alertaTaxa.innerText = `⚠️ Aplicada taxa administrativa de ${taxaAcrescimoConfig}% por parcela excedente. Parcela atual: ${numParcelas}x de R$ ${valorParcelado.toFixed(2).replace('.', ',')}`;
                    }
                } else {
                    if(alertaTaxa) alertaTaxa.style.display = "none";
                }
            }

            txtTotalCarrinho.innerText = `R$ ${valorFaturadoFinal.toFixed(2).replace('.', ',')}`;
            ajustarEstadoBotaoFinalizar();
        }

        function ajustarEstadoBotaoFinalizar() {
            if(!btnFecharPedido) return;
            if(carrinhoLocal.length > 0) {
                btnFecharPedido.disabled = false;
            } else {
                btnFecharPedido.disabled = true;
            }
        }

        if(selectMetodo) {
            selectMetodo.addEventListener("change", () => {
                if(selectMetodo.value === "credito") {
                    wrapperParcelas.style.display = "flex";
                } else {
                    wrapperParcelas.style.display = "none";
                    if(alertaTaxa) alertaTaxa.style.display = "none";
                }
                atualizarCarrinhoVisual();
            });
        }

        if(selectParcelas) {
            selectParcelas.addEventListener("change", atualizarCarrinhoVisual);
        }

        // --- SUBMISSÃO E VALIDAÇÃO ATÔMICA DO PEDIDO ---
        if(btnFecharPedido) {
            btnFecharPedido.addEventListener("click", async () => {
                emailUsuarioLogado = localStorage.getItem("usuarioLogadoEmail") || "";

                if(!emailUsuarioLogado) {
                    alert("Ação negada: Nenhum usuário identificado no sistema. Por favor, realize o login antes de acessar o catálogo.");
                    return;
                }
                if(carrinhoLocal.length === 0) {
                    alert("Carrinho vazio!");
                    return;
                }

                btnFecharPedido.disabled = true;
                btnFecharPedido.innerText = "Processando transação...";

                try {
                    // 1. SE ESTIVER EM MODO EDIÇÃO: Devolve o estoque antigo ao banco temporariamente antes de recalcular
                    if (pedidoEmEdicaoId) {
                        for (const idOriginal in itensOriginaisDoPedido) {
                            const qtdParaDevolver = parseInt(itensOriginaisDoPedido[idOriginal].quantidade || 0, 10);
                            await runTransaction(ref(db, `produtos/${idOriginal}/estoque`), (estoqueAtual) => {
                                if (estoqueAtual === null) return qtdParaDevolver;
                                return estoqueAtual + qtdParaDevolver;
                            });
                        }
                    }

                    // 2. Validação Atômica do Estoque com base na nova compra
                    for (const cartItem of carrinhoLocal) {
                        const snapshotEstoque = await new Promise((resolve) => {
                            onValue(ref(db, `produtos/${cartItem.id}/estoque`), (snap) => resolve(snap), { onlyOnce: true });
                        });
                        const estoqueAtualReal = parseInt(snapshotEstoque.val() || 0, 10);
                        if (estoqueAtualReal < cartItem.quantidade) {
                            alert(`Falha: O produto "${cacheProdutos[cartItem.id]?.nome || 'Item'}" não possui estoque suficiente. Restam apenas ${estoqueAtualReal} unidades.`);
                            
                            // Cancela a transação e se for o caso devolve o retido de volta
                            if (pedidoEmEdicaoId) {
                                for (const idOriginal in itensOriginaisDoPedido) {
                                    const qtdParaDevolver = parseInt(itensOriginaisDoPedido[idOriginal].quantidade || 0, 10);
                                    await runTransaction(ref(db, `produtos/${idOriginal}/estoque`), (estoqueAtual) => {
                                        return Math.max(0, estoqueAtual - qtdParaDevolver);
                                    });
                                }
                            }

                            btnFecharPedido.disabled = false;
                            btnFecharPedido.innerText = pedidoEmEdicaoId ? "💾 Salvar Alterações do Pedido Pendente" : "Confirmar Pedido 🚀";
                            return;
                        }
                    }

                    // 3. Transação Atômica: Deduz os novos itens do estoque
                    let objItensLote = {};
                    let totalBasePedido = 0;

                    for (const cartItem of carrinhoLocal) {
                        const infoProd = cacheProdutos[cartItem.id];
                        totalBasePedido += parseFloat(infoProd.preco || 0) * cartItem.quantidade;

                        objItensLote[cartItem.id] = {
                            nome: infoProd.nome,
                            quantidade: cartItem.quantidade,
                            precoUnitario: parseFloat(infoProd.preco || 0)
                        };

                        await runTransaction(ref(db, `produtos/${cartItem.id}/estoque`), (estoqueAtual) => {
                            if (estoqueAtual === null) return 0;
                            return Math.max(0, estoqueAtual - cartItem.quantidade);
                        });
                    }

                    // 4. Processamento de Faturamento
                    let numParcelas = 1;
                    let valorFaturadoFinal = totalBasePedido;

                    if (selectMetodo && selectMetodo.value === "credito") {
                        numParcelas = parseInt(selectParcelas.value || 1, 10);
                        if(numParcelas > 6) {
                            let excedentes = numParcelas - 6;
                            valorFaturadoFinal = totalBasePedido * (1 + ((taxaAcrescimoConfig / 100) * excedentes));
                        }
                    }

                    // 5. Criação ou Atualização do Pedido no Firebase
                    const pedidoRef = pedidoEmEdicaoId ? ref(db, `pedidos/${pedidoEmEdicaoId}`) : push(ref(db, "pedidos"));
                    
                    await set(pedidoRef, {
                        email: emailUsuarioLogado.trim().toLowerCase(),
                        total: valorFaturadoFinal,
                        status: "pendente",
                        data: new Date().toLocaleString('pt-BR'),
                        itens: objItensLote,
                        faturamento: {
                            formaPagamento: selectMetodo ? selectMetodo.value : "pix",
                            parcelas: numParcelas,
                            valorFaturado: valorFaturadoFinal
                        }
                    });

                    alert(pedidoEmEdicaoId ? "Seu pedido pendente foi atualizado com sucesso!" : "Seu pedido foi registrado com sucesso!");
                    
                    // Limpa estados de edição do LocalStorage
                    localStorage.removeItem("pedido_em_edicao_id");
                    localStorage.removeItem("pedido_em_edicao_itens");
                    localStorage.removeItem("pedido_em_edicao_pagamento");

                    carrinhoLocal = [];
                    window.location.href = "meus_pedidos.html";

                } catch (error) {
                    console.error("Erro na transação de checkout:", error);
                    alert("Ocorreu um problema ao registrar sua compra. Tente novamente.");
                } finally {
                    btnFecharPedido.disabled = false;
                    btnFecharPedido.innerText = "Confirmar Pedido 🚀";
                }
            });
        }
    </script>
</body>
</html>
