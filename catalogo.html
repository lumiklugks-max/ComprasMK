<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Nosso Catálogo de Produtos</title>
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-catalogo {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            max-width: 1200px;
        }
        .header-catalogo h1 {
            color: #00d2ff;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .header-catalogo p {
            color: #a8a8b3;
            font-size: 1.1rem;
            margin: 0;
        }
        
        /* Grid de Cards de Produtos */
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
            padding: 10px;
        }
        .card-produto {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.2s, border-color 0.2s;
        }
        .card-produto:hover {
            transform: translateY(-5px);
            border-color: #00d2ff;
        }
        .container-img-card {
            width: 100%;
            height: 220px;
            background-color: #121214;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #29292e;
        }
        .img-produto-card {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-produto-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .titulo-produto-card {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        .descricao-produto-card {
            font-size: 0.9rem;
            color: #a8a8b3;
            margin: 0 0 15px 0;
            line-height: 1.4;
            flex-grow: 1;
        }
        .preco-produto-card {
            font-size: 1.5rem;
            color: #00e676;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .estoque-produto-card {
            font-size: 0.85rem;
            color: #8d8d99;
            margin-bottom: 15px;
        }
        .btn-adicionar-carrinho {
            background-color: #00d2ff;
            color: #121214;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-adicionar-carrinho:hover {
            background-color: #00b8e6;
        }
        
        /* Mensagem de Feedback Textual */
        .status-carregamento {
            grid-column: 1 / -1;
            text-align: center;
            color: #a8a8b3;
            padding: 50px;
            font-size: 1.2rem;
            background-color: #202024;
            border-radius: 8px;
            border: 1px dashed #29292e;
        }
    </style>
</head>
<body>

    <div class="header-catalogo">
        <h1>🛒 Nosso Catálogo Comercial</h1>
        <p>Escolha seus itens favoritos e faça seus pedidos diretamente em nosso sistema</p>
    </div>

    <div id="container-grid-produtos" class="grid-produtos">
        <div class="status-carregamento" id="msg-status-catalogo">
            Buscando produtos no banco de dados... Por favor, aguarde.
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Configuração idêntica conectada ao banco ComprasMK
    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "comprasmk-241ae.firebaseapp.com",
        databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
        projectId: "comprasmk-241ae",
        storageBucket: "comprasmk-241ae.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const gridContainer = document.getElementById('container-grid-produtos');
    const msgStatus = document.getElementById('msg-status-catalogo');

    // ESCUTA EM TEMPO REAL OS PRODUTOS DO BANCO DE DADOS
    onValue(ref(db, 'produtos'), (snapshot) => {
        if (!gridContainer) return;

        // Se o nó de produtos não existir ou estiver vazio (null)
        if (!snapshot.exists()) {
            gridContainer.innerHTML = `<div class="status-carregamento">Nenhum produto disponível no catálogo neste momento. 🏢</div>`;
            return;
        }

        const produtos = snapshot.val();
        gridContainer.innerHTML = ""; // Limpa a mensagem de carregamento inicial

        Object.keys(produtos).forEach((id) => {
            const prod = produtos[id];
            if (!prod) return;

            // Tratamento rígido de formatação monetária brasileira
            let precoExibicao = "R$ 0,00";
            if (prod.preco !== undefined && prod.preco !== null) {
                const valorNum = parseFloat(prod.preco);
                if (!isNaN(valorNum)) {
                    precoExibicao = "R$ " + valorNum.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
            }

            // Fallbacks preventivos caso falte alguma propriedade no nó
            const urlImagem = prod.imagem || "https://via.placeholder.com/300x220?text=Sem+Foto";
            const nomeItem = prod.nome || "Produto sem Identificação";
            const descItem = prod.descricao || "Nenhuma descrição fornecida para este item.";
            const totalEstoque = prod.estoque !== undefined ? prod.estoque : 0;

            // Criação estrutural do card via manipulação explícita de DOM
            const card = document.createElement('div');
            card.className = "card-produto";
            card.innerHTML = `
                <div class="container-img-card">
                    <img src="${urlImagem}" class="img-produto-card" alt="${nomeItem}" onerror="this.src='https://via.placeholder.com/300x220?text=Erro+ao+Carregar'">
                </div>
                <div class="info-produto-card">
                    <h3 class="titulo-produto-card">${nomeItem}</h3>
                    <p class="descricao-produto-card">${descItem}</p>
                    <div class="preco-produto-card">${precoExibicao}</div>
                    <div class="estoque-produto-card">Disponível: <strong>${totalEstoque} unidades</strong></div>
                    <button class="btn-adicionar-carrinho" onclick="adicionarAoCarrinhoGlobal('${id}', '${nomeItem.replace(/'/g, "\\'")}')">
                        🛒 Adicionar ao Pedido
                    </button>
                </div>
            `;
            gridContainer.appendChild(card);
        });
    }, (error) => {
        console.error("Erro crítico ao escutar o catálogo:", error);
        if (gridContainer) {
            gridContainer.innerHTML = `<div class="status-carregamento" style="color: #ff4b2b;">Falha de comunicação com o banco de dados. Tente atualizar a página.</div>`;
        }
    });

    // Função de clique do usuário mapeada globalmente
    window.adicionarAoCarrinhoGlobal = function(id, nome) {
        alert("Item selecionado: " + nome + "\nPronto para integração com o fluxo de pedidos!");
    };
</script>
</body>
</html>
