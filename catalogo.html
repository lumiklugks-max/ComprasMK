<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* BARRA SUPERIOR */
        .navbar {
            max-width: 1000px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .navbar a {
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            color: #00d2ff;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
        }

        /* SEÇÃO DE AVISO DE PEDIDO PENDENTE */
        .aviso-pendente {
            grid-column: span 2;
            background-color: rgba(255, 165, 0, 0.15);
            border: 1px solid #ffa500;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            display: none; /* Ativado via JS */
        }
        @media (max-width: 800px) {
            .aviso-pendente { grid-column: span 1; flex-direction: column; gap: 10px; text-align: center; }
        }
        .aviso-text h4 { margin: 0 0 5px 0; color: #ffa500; }
        .aviso-text p { margin: 0; font-size: 14px; color: #cccccc; }
        .btn-editar-pedido {
            background-color: #ffa500;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-editar-pedido:hover { background-color: #cc8400; }

        /* GRID DE PRODUTOS */
        .produtos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .produto-card {
            background-color: #1f2833;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #2c3540;
        }
        .produto-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #0b0c10;
        }
        .produto-nome { font-size: 16px; margin: 10px 0 5px 0; font-weight: bold; }
        .produto-desc { font-size: 12px; color: #aaaaaa; margin: 0 0 10px 0; min-height: 32px; }
        .produto-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .produto-preco { color: #00ff66; font-weight: bold; font-size: 18px; }
        .produto-estoque { font-size: 12px; color: #00d2ff; }
        .produto-estoque.esgotado { color: #ff4d4d; }
        .btn-add {
            background-color: #00d2ff;
            color: #000000;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover { background-color: #00b4db; }
        .btn-add:disabled { background-color: #333; color: #777; cursor: not-allowed; }

        /* CAIXA DO CARRINHO */
        .carrinho-box {
            background-color: #1f2833;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            height: fit-content;
            border: 1px solid #2c3540;
        }
        .carrinho-box h3 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .carrinho-itens { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; max-height: 250px; overflow-y: auto; }
        .carrinho-item { display: flex; justify-content: space-between; font-size: 14px; background: #0b0c10; padding: 8px; border-radius: 4px; }
        .btn-remover-item { background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: bold; }
        .carrinho-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; color: #00ff66; }
        
        /* FORMULÁRIO DE CHECKOUT */
        .checkout-form { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .checkout-form input { background-color: #0b0c10; border: 1px solid #45f3ff33; border-radius: 6px; padding: 10px; color: #ffffff; outline: none; }
        .checkout-form input:focus { border-color: #00d2ff; }
        .btn-finalizar { background-color: #00ff66; color: #000000; border: none; padding: 12px; font-weight: bold; font-size: 15px; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
        .btn-finalizar:hover { background-color: #00cc55; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>🛒 Catálogo de Compras</h2>
        <a href="admin_pedidos.html">⚙️ Acesso Administrativo</a>
    </div>

    <div class="container">
        
        <div id="aviso-pendente" class="aviso-pendente">
            <div class="aviso-text">
                <h4>⚠️ Você possui um pedido PENDENTE!</h4>
                <p id="aviso-pedido-info">Deseja recuperar os itens e modificar o seu pedido atual?</p>
            </div>
            <button class="btn-editar-pedido" id="btn-reabrir-pedido">✏️ Editar Meu Pedido</button>
        </div>

        <div>
            <div id="produtos-grid" class="produtos-grid">
                <p>Carregando catálogo de produtos...</p>
            </div>
        </div>

        <div class="carrinho-box">
            <h3>🛍️ Meu Carrinho</h3>
            <div id="carrinho-itens" class="carrinho-itens">
                <p style="color: #888; font-size: 14px; text-align: center;">Seu carrinho está vazio.</p>
            </div>
            
            <div class="carrinho-total">
                <span>Total:</span>
                <span id="carrinho-total-val">R$ 0,00</span>
            </div>

            <div class="checkout-form">
                <label style="font-size: 12px; color: #aaa;">Informe seu e-mail para finalizar ou consultar pedidos:</label>
                <input type="email" id="cliente-email" placeholder="seu-email@email.com" required>
                <button class="btn-finalizar" id="btn-finalizar-compra">🚀 Enviar Pedido</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "comprasmk-241ae.firebaseapp.com",
            databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
            projectId: "comprasmk-241ae",
            storageBucket: "comprasmk-241ae.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Estados locais da aplicação cliente
        let produtosGlobais = {};
        let carrinho = [];
        let idPedidoPendenteEncontrado = null;
        let dadosPedidoPendenteEncontrado = null;

        const produtosGrid = document.getElementById("produtos-grid");
        const carrinhoItensContainer = document.getElementById("carrinho-itens");
        const carrinhoTotalVal = document.getElementById("carrinho-total-val");
        const inputEmail = document.getElementById("cliente-email");
        const avisoPendente = document.getElementById("aviso-pendente");
        const avisoPedidoInfo = document.getElementById("aviso-pedido-info");
        const btnReabrirPedido = document.getElementById("btn-reabrir-pedido");

        // --- 1. ESCUTA O BANCO DE PRODUTOS E ATUALIZA A TELA ---
        onValue(ref(db, "produtos"), (snapshot) => {
            if (!snapshot.exists()) {
                produtosGrid.innerHTML = "<p>Nenhum produto disponível no momento.</p>";
                return;
            }
            produtosGlobais = snapshot.val();
            renderizarCatalogo();
        });

        function renderizarCatalogo() {
            produtosGrid.innerHTML = "";
            Object.keys(produtosGlobais).forEach(id => {
                const prod = produtosGlobais[id];
                const card = document.createElement("div");
                card.className = "produto-card";
                
                const estoqueDisponivel = parseInt(prod.estoque || 0, 10);
                const isEsgotado = estoqueDisponivel <= 0;

                card.innerHTML = `
                    <img src="${prod.imagem || 'https://via.placeholder.com/150'}" class="produto-img" alt="${prod.nome}">
                    <div class="produto-nome">${prod.nome}</div>
                    <div class="produto-desc">${prod.descricao || ''}</div>
                    <div class="produto-meta">
                        <span class="produto-preco">R$ ${parseFloat(prod.preco).toFixed(2).replace('.', ',')}</span>
                        <span class="produto-estoque ${isEsgotado ? 'esgotado' : ''}">
                            ${isEsgotado ? 'Esgotado' : `Estoque: ${estoqueDisponivel}`}
                        </span>
                    </div>
                    <button class="btn-add" ${isEsgotado ? 'disabled' : ''} data-id="${id}">
                        ${isEsgotado ? '❌ Indisponível' : '➕ Adicionar'}
                    </button>
                `;

                if(!isEsgotado) {
                    card.querySelector(".btn-add").addEventListener("click", () => adicionarAoCarrinho(id));
                }
                produtosGrid.appendChild(card);
            });
        }

        // --- 2. SISTEMA DE MONITORAMENTO DE PEDIDO PENDENTE DO CLIENTE ---
        inputEmail.addEventListener("input", (e) => {
            const emailDigitado = e.target.value.trim().toLowerCase();
            if (emailDigitado.includes("@") && emailDigitado.includes(".")) {
                verificarPedidoPendente(emailDigitado);
            } else {
                avisoPendente.style.display = "none";
                idPedidoPendenteEncontrado = null;
            }
        });

        function verificarPedidoPendente(email) {
            onValue(ref(db, "pedidos"), (snapshot) => {
                if (!snapshot.exists()) return;
                
                let achou = false;
                const todosPedidos = snapshot.val();
                
                Object.keys(todosPedidos).forEach(id => {
                    const p = todosPedidos[id];
                    if (p.email && p.email.toLowerCase() === email && p.status === "pendente") {
                        achou = true;
                        idPedidoPendenteEncontrado = id;
                        dadosPedidoPendenteEncontrado = p;
                    }
                });

                if (achou) {
                    avisoPedidoInfo.innerText = `Você possui o pedido código (${idPedidoPendenteEncontrado}) no valor de R$ ${dadosPedidoPendenteEncontrado.total.toFixed(2).replace('.',',')} aguardando aprovação.`;
                    avisoPendente.style.display = "flex";
                } else {
                    avisoPendente.style.display = "none";
                    idPedidoPendenteEncontrado = null;
                }
            }, { onlyOnce: true });
        }

        // --- 3. LÓGICA CRÍTICA: REABRIR E EDITAR PEDIDO PENDENTE ---
        btnReabrirPedido.addEventListener("click", async () => {
            if (!idPedidoPendenteEncontrado || !dadosPedidoPendenteEncontrado) return;

            if (confirm("Ao editar, seu pedido atual pendente será cancelado, as quantidades voltarão para o estoque e os itens retornarão para o seu carrinho de compras para modificação. Continuar?")) {
                
                const itensDoPedido = dadosPedidoPendenteEncontrado.itens;
                
                // 1. Devolve os produtos de volta ao estoque via Transação Atômica
                if (itensDoPedido) {
                    for (const itemKey of Object.keys(itensDoPedido)) {
                        const item = itensDoPedido[itemKey];
                        const qtdRetorno = item.quantidade || 1;
                        const produtoId = item.id || itemKey;

                        const estoqueRef = ref(db, `produtos/${produtoId}/estoque`);
                        await runTransaction(estoqueRef, (currentEstoque) => {
                            if (currentEstoque === null) return currentEstoque;
                            return currentEstoque + qtdRetorno;
                        });

                        // 2. Insere o item de volta no carrinho local do navegador do cliente
                        carrinho.push({
                            id: produtoId,
                            nome: item.nome || itemKey,
                            preco: item.precoUnitario || 0,
                            quantidade: qtdRetorno
                        });
                    }
                }

                // 3. Deleta o registro do pedido pendente antigo do banco
                await remove(ref(db, `pedidos/${idPedidoPendenteEncontrado}`));

                alert("Pedido reaberto com sucesso! Seus itens antigos já estão no carrinho de compras abaixo.");
                
                // Reseta variáveis de verificação e atualiza a interface
                avisoPendente.style.display = "none";
                idPedidoPendenteEncontrado = null;
                dadosPedidoPendenteEncontrado = null;
                
                atualizarCarrinhoVisual();
            }
        });

        // --- 4. FUNÇÕES OPERACIONAIS DO CARRINHO ---
        function adicionarAoCarrinho(id) {
            const produto = produtosGlobais[id];
            if (!produto) return;

            const itemNoCarrinho = carrinho.find(item => item.id === id);
            if (itemNoCarrinho) {
                if (itemNoCarrinho.quantidade + 1 > produto.estoque) {
                    alert("Desculpe, quantidade máxima atingida de acordo com nosso estoque disponível.");
                    return;
                }
                itemNoCarrinho.quantidade += 1;
            } else {
                carrinho.push({
                    id: id,
                    nome: produto.nome,
                    preco: produto.preco,
                    quantidade: 1
                });
            }
            atualizarCarrinhoVisual();
        }

        function removerDoCarrinho(id) {
            carrinho = carrinho.filter(item => item.id !== id);
            atualizarCarrinhoVisual();
        }

        function atualizarCarrinhoVisual() {
            carrinhoItensContainer.innerHTML = "";
            
            if (carrinho.length === 0) {
                carrinhoItensContainer.innerHTML = `<p style="color: #888; font-size: 14px; text-align: center;">Seu carrinho está vazio.</p>`;
                carrinhoTotalVal.innerText = "R$ 0,00";
                return;
            }

            let somaTotal = 0;

            carrinho.forEach(item => {
                const totalItem = item.preco * item.quantidade;
                somaTotal += totalItem;

                const itemDiv = document.createElement("div");
                itemDiv.className = "carrinho-item";
                itemDiv.innerHTML = `
                    <div>
                        <strong>${item.nome}</strong><br>
                        <span style="color: #00d2ff;">${item.quantidade}x</span> R$ ${item.preco.toFixed(2).replace('.', ',')}
                    </div>
                    <button class="btn-remover-item" data-id="${item.id}">❌</button>
                `;

                itemDiv.querySelector(".btn-remover-item").addEventListener("click", () => removerDoCarrinho(item.id));
                carrinhoItensContainer.appendChild(itemDiv);
            });

            carrinhoTotalVal.innerText = `R$ ${somaTotal.toFixed(2).replace('.', ',')}`;
        }

        // --- 5. FECHAMENTO E FINALIZAÇÃO DO PEDIDO (BAIXA NO ESTOQUE) ---
        document.getElementById("btn-finalizar-compra").addEventListener("click", async () => {
            const emailCliente = inputEmail.value.trim();
            
            if (!emailCliente || !emailCliente.includes("@")) {
                alert("Por favor, preencha um e-mail válido para realizar a compra.");
                return;
            }

            if (carrinho.length === 0) {
                alert("Seu carrinho está vazio! Adicione produtos antes de enviar.");
                return;
            }

            if (idPedidoPendenteEncontrado) {
                alert("Você já possui um pedido pendente ativo associado a este e-mail. Clique no botão 'Editar Meu Pedido' no topo para alterá-lo.");
                return;
            }

            // Diminui o estoque no Firebase usando transações individuais para garantir segurança de concorrência
            let checkoutValido = true;
            const itensObjetoPedido = {};
            let faturamentoFinal = 0;

            for (const item of carrinho) {
                const estoqueRef = ref(db, `produtos/${item.id}/estoque`);
                let erroEstoque = false;

                await runTransaction(estoqueRef, (currentEstoque) => {
                    if (currentEstoque === null) return currentEstoque;
                    if (currentEstoque < item.quantidade) {
                        erroEstoque = true;
                        return currentEstoque; // Aborta alteração
                    }
                    return currentEstoque - item.quantidade;
                });

                if (erroEstoque) {
                    alert(`Erro: O produto "${item.nome}" acabou de esgotar ou não possui quantidade suficiente em estoque.`);
                    checkoutValido = false;
                    break;
                }

                // Prepara o nó de itens formatado para o Firebase
                itensObjetoPedido[item.id] = {
                    nome: item.nome,
                    quantidade: item.quantidade,
                    precoUnitario: item.preco
                };
                faturamentoFinal += (item.preco * item.quantidade);
            }

            if (!checkoutValido) return; // Se falhou no estoque, cancela inserção

            // Grava o pedido na pasta 'pedidos' do Realtime Database
            try {
                const pedidosRef = ref(db, "pedidos");
                const novoPedidoRef = push(pedidosRef);

                const dataAtual = new Date();
                const dataFormatada = dataAtual.toLocaleDateString('pt-BR') + ' ' + dataAtual.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

                await set(novoPedidoRef, {
                    email: emailCliente.toLowerCase(),
                    total: faturamentoFinal,
                    status: "pendente",
                    data: dataFormatada,
                    itens: itensObjetoPedido
                });

                alert("Pedido enviado com sucesso! Aguarde a aprovação do administrador.");
                
                // Limpa carrinho e formulário local
                carrinho = [];
                atualizarCarrinhoVisual();
                inputEmail.value = "";

            } catch (error) {
                console.error("Erro ao registrar venda:", error);
                alert("Ocorreu um problema ao processar seu checkout no banco.");
            }
        });
    </script>
</body>
</html>
