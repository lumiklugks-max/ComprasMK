<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Cadastrar e Gerenciar Produtos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .menu-nav a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
        }
        .admin-container {
            width: 100%;
            max-width: 1000px;
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 40px;
            box-sizing: border-box;
        }
        h1, h2 {
            color: #ffffff;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .form-cadastro {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        @media (max-width: 768px) {
            .form-cadastro { grid-template-columns: 1fr; }
        }
        .grupo-input { display: flex; flex-direction: column; }
        .grupo-input.full-width { grid-column: span 2; }
        @media (max-width: 768px) { .grupo-input.full-width { grid-column: span 1; } }
        .grupo-input label { font-size: 0.9rem; color: #a8a8b3; margin-bottom: 8px; font-weight: bold; }
        .grupo-input input, .grupo-input textarea {
            background-color: #121214; border: 1px solid #29292e; border-radius: 6px;
            padding: 12px; color: #ffffff; font-size: 1rem; outline: none; transition: border-color 0.2s;
        }
        .grupo-input input:focus, .grupo-input textarea:focus { border-color: #00d2ff; }
        .grupo-input textarea { resize: vertical; min-height: 80px; }
        .btn-cadastrar {
            grid-column: span 2; background-color: #00d2ff; color: #121214; border: none;
            padding: 15px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: background-color 0.2s, transform 0.1s; margin-top: 10px;
        }
        @media (max-width: 768px) { .btn-cadastrar { grid-column: span 1; } }
        .btn-cadastrar:hover { background-color: #00b8e6; }
        .btn-cadastrar:active { transform: scale(0.98); }
        .wrapper-tabela { width: 100%; overflow-x: auto; }
        .tabela-produtos { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
        .tabela-produtos th { color: #00d2ff; padding: 14px; border-bottom: 2px solid #29292e; font-size: 0.95rem; background-color: #121214; }
        .tabela-produtos td { padding: 14px; border-bottom: 1px solid #29292e; color: #e1e1e6; font-size: 0.95rem; vertical-align: middle; }
        .tabela-produtos tr:hover { background-color: #29292e; }
        .img-produto-tabela { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; background-color: #121214; border: 1px solid #323238; }
        .preco-destaque { color: #00e676; font-weight: bold; }
        .btn-excluir-prod { background-color: #ff4b2b; color: #ffffff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-excluir-prod:hover { background-color: #e03b1a; }
        .btn-ajustar-estoque { background-color: #323238; color: #00d2ff; border: 1px solid #29292e; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: 5px; }
        .btn-ajustar-estoque:hover { background-color: #41414c; }
    </style>
</head>
<body>

    <div class="menu-nav">
        <a href="admin_pedidos.html">📋 Painel de Pedidos Recebidos</a>
        <a href="catalogo.html" target="_blank">🛒 Abrir o Catálogo Público</a>
    </div>

    <div class="admin-container">
        <h1>🛠️ Gerenciar Produtos do Catálogo</h1>
        
        <h2>Adicionar Novo Produto</h2>
        <form id="form-cadastro-produto" class="form-cadastro">
            <div class="grupo-input">
                <label for="prod-nome">Nome do Produto *</label>
                <input type="text" id="prod-nome" placeholder="Ex: Mouse Gamer RGB" required>
            </div>
            <div class="grupo-input">
                <label for="prod-preco">Preço de Venda (R$) *</label>
                <input type="number" id="prod-preco" step="0.01" placeholder="Ex: 149.90" required>
            </div>
            <div class="grupo-input">
                <label for="prod-estoque">Quantidade em Estoque *</label>
                <input type="number" id="prod-estoque" placeholder="Ex: 50" required>
            </div>
            <div class="grupo-input">
                <label for="prod-imagem">URL da Imagem do Produto *</label>
                <input type="url" id="prod-imagem" placeholder="https://linkdaimagem.com/foto.jpg" required>
            </div>
            <div class="grupo-input full-width">
                <label for="prod-descricao">Descrição Detalhada do Produto</label>
                <textarea id="prod-descricao" placeholder="Descreva as especificações técnicas do item..."></textarea>
            </div>
            <button type="submit" class="btn-cadastrar">🚀 Cadastrar Produto no Catálogo</button>
        </form>

        <hr style="border: 0; border-top: 1px solid #29292e; margin: 40px 0;">

        <h2>Produtos Ativos no Sistema</h2>
        <div class="wrapper-tabela">
            <table class="tabela-produtos">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-produtos">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #a8a8b3; padding: 30px;">Buscando produtos no banco de dados...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
    authDomain: "comprasmk-241ae.firebaseapp.com",
    databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
    projectId: "comprasmk-241ae",
    storageBucket: "comprasmk-241ae.firebasestorage.app",
    appId: "1:908890693829:web:2bd31d24474e27507310ac"
};
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tabelaCorpo = document.getElementById('corpo-tabela-produtos');
    const formCadastro = document.getElementById('form-cadastro-produto');

    onValue(ref(db, 'produtos'), (snapshot) => {
        if (!tabelaCorpo) return;
        if (!snapshot.exists()) {
            tabelaCorpo.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #a8a8b3; padding: 30px;">Nenhum produto cadastrado no momento.</td></tr>`;
            return;
        }
        const produtos = snapshot.val();
        tabelaCorpo.innerHTML = "";

        Object.keys(produtos).forEach((id) => {
            const prod = produtos[id];
            if (!prod) return;

            let precoFormatado = "R$ 0,00";
            if (prod.preco !== undefined && prod.preco !== null) {
                const valorNum = parseFloat(prod.preco);
                if (!isNaN(valorNum)) precoFormatado = "R$ " + valorNum.toFixed(2);
            }

            const imgUrl = prod.imagem || "https://via.placeholder.com/55";
            const nomeProd = prod.nome || "Produto sem nome";
            const descProd = prod.descricao || "Sem descrição preenchida.";
            const estoqueProd = prod.estoque !== undefined ? prod.estoque : 0;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img src="${imgUrl}" class="img-produto-tabela" alt="${nomeProd}"></td>
                <td><strong>${nomeProd}</strong></td>
                <td style="color: #a8a8b3; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${descProd}</td>
                <td class="preco-destaque">${precoFormatado}</td>
                <td>
                    <span>${estoqueProd} un</span>
                    <button class="btn-ajustar-estoque" onclick="alterarEstoqueManual('${id}', ${estoqueProd})">✏️ Alterar</button>
                </td>
                <td>
                    <button class="btn-excluir-prod" onclick="removerProdutoDoBanco('${id}')">Excluir</button>
                </td>
            `;
            tabelaCorpo.appendChild(tr);
        });
    });

    if (formCadastro) {
        formCadastro.addEventListener('submit', (e) => {
            e.preventDefault();
            const nome = document.getElementById('prod-nome').value.trim();
            const preco = parseFloat(document.getElementById('prod-preco').value);
            const estoque = parseInt(document.getElementById('prod-estoque').value, 10);
            const imagem = document.getElementById('prod-imagem').value.trim();
            const descricao = document.getElementById('prod-descricao').value.trim();

            const novoProdutoRef = push(ref(db, 'produtos'));
            set(novoProdutoRef, { nome, preco, estoque, imagem, descricao: descricao || "Sem descrição." })
            .then(() => { alert("Produto cadastrado! 🎉"); formCadastro.reset(); });
        });
    }

    window.alterarEstoqueManual = function(id, estoqueAtual) {
        const novoEstoqueStr = prompt(`Defina a nova quantidade de estoque para este produto:`, estoqueAtual);
        if (novoEstoqueStr === null) return;
        const novoEstoque = parseInt(novoEstoqueStr, 10);
        if (isNaN(novoEstoque) || novoEstoque < 0) {
            alert("Quantidade inválida!");
            return;
        }
        update(ref(db, 'produtos/' + id), { estoque: novoEstoque })
            .then(() => alert("Estoque atualizado com sucesso!"));
    };

    window.removerProdutoDoBanco = function(id) {
        if (confirm("Deseja remover este produto do catálogo?")) {
            remove(ref(db, 'produtos/' + id));
        }
    };
</script>
</body>
</html>
