<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Produtos do Catálogo</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* LINKS SUPERIORES DE NAVEGAÇÃO */
        .navbar {
            max-width: 800px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .navbar a {
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-painel { color: #00d2ff; }
        .btn-catalogo { color: #00ff66; }

        /* CARD DO FORMULÁRIO */
        .form-container, .list-container {
            background-color: #1f2833;
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
            margin-bottom: 30px;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #aaaaaa;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: bold;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group-full {
            grid-column: span 2;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        @media (max-width: 600px) {
            .form-group-full { grid-column: span 1; }
        }
        label {
            font-size: 14px;
            font-weight: 600;
            color: #c5c6c7;
        }
        input, textarea {
            background-color: #0b0c10;
            border: 1px solid #45f3ff33;
            border-radius: 6px;
            padding: 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #00d2ff;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .btn-submit {
            background-color: #00d2ff;
            color: #000000;
            border: none;
            width: 100%;
            padding: 14px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #00b4db;
        }

        /* LISTA DE PRODUTOS */
        .produtos-lista {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .produto-item {
            background-color: #0b0c10;
            border: 1px solid #45f3ff1a;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .produto-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .produto-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
        .produto-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .produto-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #1f2833;
        }
        .produto-detalhes h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #ffffff;
        }
        .produto-detalhes p {
            margin: 0;
            font-size: 14px;
            color: #00ff66;
            font-weight: bold;
        }
        .produto-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .estoque-controle {
            display: flex;
            align-items: center;
            background-color: #1f2833;
            border-radius: 6px;
            padding: 2px;
            border: 1px solid #45f3ff33;
        }
        .btn-estoque {
            background: none;
            border: none;
            color: #00d2ff;
            font-size: 18px;
            font-weight: bold;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .btn-estoque:hover {
            color: #ffffff;
        }
        .estoque-valor {
            font-size: 14px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
        .btn-remover {
            background-color: #ff4d4d;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-remover:hover {
            background-color: #cc3333;
        }
        .no-products {
            text-align: center;
            color: #aaaaaa;
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="admin_pedidos.html" class="btn-painel">📋 Painel de Pedidos Recebidos</a>
        <a href="catalogo.html" class="btn-catalogo">🛒 Abrir o Catálogo Público</a>
    </div>

    <div class="form-container">
        <h2>🛠️ Gerenciar Produtos do Catálogo</h2>
        <div class="subtitle">Adicionar Novo Produto</div>

        <form id="produto-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome do Produto *</label>
                    <input type="text" id="nome" placeholder="Ex: Mouse Gamer RGB" required>
                </div>
                <div class="form-group">
                    <label for="preco">Preço de Venda (R$) *</label>
                    <input type="text" id="preco" placeholder="Ex: 149.90" required>
                </div>
                <div class="form-group">
                    <label for="estoque">Quantidade em Estoque *</label>
                    <input type="number" id="estoque" placeholder="Ex: 50" min="0" required>
                </div>
                <div class="form-group">
                    <label for="imagem">URL da Imagem do Produto *</label>
                    <input type="url" id="imagem" placeholder="https://linkdaimagem.com/foto.jpg" required>
                </div>
                
                <div class="form-group-full">
                    <label for="linkWpp">Link de Checkout / WhatsApp Personalizado (Opcional)</label>
                    <input type="url" id="linkWpp" placeholder="https://wa.me/55... ou link de pagamento">
                </div>

                <div class="form-group-full">
                    <label for="descricao">Descrição Detalhada do Produto</label>
                    <textarea id="descricao" placeholder="Descreva as especificações, tamanhos, cores ou detalhes técnicos do item..."></textarea>
                </div>
            </div>

            <button type="submit" class="btn-submit">🚀 Cadastrar Produto no Catálogo</button>
        </form>
    </div>

    <div class="list-container">
        <h2>📦 Produtos Cadastrados</h2>
        <div class="subtitle" style="margin-bottom: 15px;">Controle de Estoque e Remoção</div>
        <div id="produtos-lista" class="produtos-lista">
            <div class="no-products">Buscando produtos no banco de dados...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "comprasmk-241ae.firebaseapp.com",
            databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
            projectId: "comprasmk-241ae",
            storageBucket: "comprasmk-241ae.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const produtosListaContainer = document.getElementById("produtos-lista");

        // --- EXIBIÇÃO EM TEMPO REAL DOS PRODUTOS ---
        onValue(ref(db, "produtos"), (snapshot) => {
            produtosListaContainer.innerHTML = "";
            
            if (!snapshot.exists()) {
                produtosListaContainer.innerHTML = `<div class="no-products">Nenhum produto cadastrado no catálogo.</div>`;
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const produtoId = childSnapshot.key;
                const produto = childSnapshot.val();

                const itemData = document.createElement("div");
                itemData.className = "produto-item";
                itemData.innerHTML = `
                    <div class="produto-info">
                        <img src="${produto.imagem || 'https://via.placeholder.com/50'}" class="produto-img" alt="${produto.nome}">
                        <div class="produto-detalhes">
                            <h4>${produto.nome}</h4>
                            <p>R$ ${parseFloat(produto.preco).toFixed(2).replace('.', ',')}</p>
                        </div>
                    </div>
                    <div class="produto-actions">
                        <div class="estoque-controle">
                            <button class="btn-estoque" data-id="${produtoId}" data-action="diminuir">−</button>
                            <span class="estoque-valor">${produto.estoque}</span>
                            <button class="btn-estoque" data-id="${produtoId}" data-action="aumentar">+</button>
                        </div>
                        <button class="btn-remover" data-id="${produtoId}">Remover</button>
                    </div>
                `;

                // Eventos de clique para os botões de ajuste de estoque
                itemData.querySelectorAll(".btn-estoque").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        const id = e.target.getAttribute("data-id");
                        const action = e.target.getAttribute("data-action");
                        let novoEstoque = parseInt(produto.estoque, 10);

                        if (action === "aumentar") {
                            novoEstoque += 1;
                        } else if (action === "diminuir") {
                            novoEstoque = Math.max(0, novoEstoque - 1);
                        }

                        update(ref(db, `produtos/${id}`), { estoque: novoEstoque });
                    });
                });

                // Evento de clique para remover o produto
                itemData.querySelector(".btn-remover").addEventListener("click", (e) => {
                    const id = e.target.getAttribute("data-id");
                    if (confirm(`Tem certeza de que deseja remover o produto "${produto.nome}" do catálogo?`)) {
                        remove(ref(db, `produtos/${id}`))
                            .then(() => alert("Produto removido com sucesso!"))
                            .catch((error) => console.error("Erro ao remover produto:", error));
                    }
                });

                produtosListaContainer.appendChild(itemData);
            });
        });

        // --- FORMULÁRIO DE CADASTRO ---
        document.getElementById("produto-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nomeValue = document.getElementById("nome").value.trim();
            let precoValue = document.getElementById("preco").value.trim();
            const estoqueValue = document.getElementById("estoque").value;
            const imagemValue = document.getElementById("imagem").value.trim();
            const linkWppValue = document.getElementById("linkWpp").value.trim(); // Captura o novo campo
            const descricaoValue = document.getElementById("descricao").value.trim();

            precoValue = precoValue.replace(',', '.');
            const precoNum = parseFloat(precoValue);
            const estoqueNum = parseInt(estoqueValue, 10);

            if (isNaN(precoNum) || precoNum <= 0) {
                alert("Por favor, digite um preço válido. Exemplo: 149.90");
                return;
            }

            try {
                const produtosRef = ref(db, "produtos");
                const novoProdutoRef = push(produtosRef);

                // Salvando o novo objeto contendo a propriedade 'linkWpp'
                await set(novoProdutoRef, {
                    nome: nomeValue,
                    preco: precoNum,
                    estoque: estoqueNum,
                    imagem: imagemValue,
                    linkWpp: linkWppValue || "", // Se vazio, salva como texto sem quebrar a estrutura
                    descricao: descricaoValue
                });

                alert("Produto cadastrado com sucesso! Ele já está disponível no seu catálogo.");
                document.getElementById("produto-form").reset();

            } catch (error) {
                console.error("Erro ao salvar produto:", error);
                alert("Erro ao conectar com o banco. Verifique as credenciais do seu Firebase.");
            }
        });
    </script>
</body>
</html>
