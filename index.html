<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no Sistema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box-container" id="container-login">
        <h2>Seja Bem-vindo! 👋</h2>
        <p>Faça login para ver nosso catálogo</p>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="login-email" placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="login-senha" placeholder="Sua senha">
        </div>

        <button class="btn-primary" id="btn-login">Entrar 🚀</button>
        <span class="link-alternar" onclick="alternarTelas()">Não tem conta? Cadastre-se aqui</span>
        <div class="msg-status" id="status-login"></div>
    </div>

    <div class="box-container" id="container-cadastro" style="display: none;">
        <h2>Criar Conta 📝</h2>
        <p>Preencha os dados abaixo para começar</p>

        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="cad-nome" placeholder="Seu nome">
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="cad-email" placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
            <label>Telefone / WhatsApp</label>
            <input type="tel" id="cad-telefone" placeholder="(00) 99999-9999">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="cad-senha" placeholder="No mínimo 6 caracteres">
        </div>

        <button class="btn-primary" id="btn-cadastrar">Cadastrar Conta Conta ✨</button>
        <span class="link-alternar" onclick="alternarTelas()">Já tem uma conta? Faça Login</span>
        <div class="msg-status" id="status-cadastro"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Sua Configuração do Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Função para alternar as telas visualmente
    window.alternarTelas = function() {
        const loginForm = document.getElementById('container-login');
        const cadForm = document.getElementById('container-cadastro');

        if (loginForm.style.display === 'none') {
            loginForm.style.display = 'block';
            cadForm.style.display = 'none';
        } else {
            loginForm.style.display = 'none';
            cadForm.style.display = 'block';
        }
    }

    // Ação de CADASTRO
    document.getElementById('btn-cadastrar').onclick = async function() {
        const nome = document.getElementById('cad-nome').value.trim();
        const email = document.getElementById('cad-email').value.trim();
        const telefone = document.getElementById('cad-telefone').value.trim();
        const senha = document.getElementById('cad-senha').value;
        const statusDiv = document.getElementById('status-cadastro');

        if (!nome || !email || !telefone || !senha) {
            statusDiv.style.color = "#ff4b2b";
            statusDiv.innerHTML = "Por favor, preencha todos os campos!";
            return;
        }

        statusDiv.style.color = "#00d2ff";
        statusDiv.innerHTML = "Criando conta...";

        try {
            // 1. Cria o usuário na Autenticação
            const resultado = await createUserWithEmailAndPassword(auth, email, senha);
            const user = resultado.user;

            // 2. Salva os dados extras no Banco (Realtime Database) vinculados ao UID dele
            await set(ref(db, 'usuarios/' + user.uid), {
                nome: nome,
                email: email,
                telefone: telefone
            });

            statusDiv.style.color = "#25d366";
            statusDiv.innerHTML = "Conta criada com sucesso! Redirecionando...";
            
            setTimeout(() => {
                window.location.href = 'catalogo.html';
            }, 1500);

        } catch (error) {
            statusDiv.style.color = "#ff4b2b";
            if (error.code === 'auth/email-already-in-use') {
                statusDiv.innerHTML = "Este e-mail já está em uso.";
            } else if (error.code === 'auth/weak-password') {
                statusDiv.innerHTML = "A senha deve ter pelo menos 6 dígitos.";
            } else {
                statusDiv.innerHTML = "Erro: " + error.message;
            }
        }
    };

    // Ação de LOGIN
    document.getElementById('btn-login').onclick = async function() {
        const email = document.getElementById('login-email').value.trim();
        const senha = document.getElementById('login-senha').value;
        const statusDiv = document.getElementById('status-login');

        if (!email || !senha) {
            statusDiv.style.color = "#ff4b2b";
            statusDiv.innerHTML = "Preencha o e-mail e a senha!";
            return;
        }

        statusDiv.style.color = "#00d2ff";
        statusDiv.innerHTML = "Entrando...";

        try {
            await signInWithEmailAndPassword(auth, email, senha);
            statusDiv.style.color = "#25d366";
            statusDiv.innerHTML = "Login realizado! Entrando...";
            
            setTimeout(() => {
                window.location.href = 'catalogo.html';
            }, 1200);

        } catch (error) {
            statusDiv.style.color = "#ff4b2b";
            statusDiv.innerHTML = "E-mail ou senha incorretos.";
        }
    };
</script>
</body>
</html>
