<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-area {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-voltar {
            background-color: #1f2833;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #333;
        }

        .login-box {
            background-color: #1f2833;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            margin-bottom: 25px;
            border: 1px solid #2c3540;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .login-box input {
            flex: 1;
            padding: 12px;
            background-color: #0b0c10;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            outline: none;
        }
        .login-box input:focus { border-color: #00d2ff; }
        .login-box button {
            padding: 12px 24px;
            background-color: #00d2ff;
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .pedidos-lista {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-pedido {
            background-color: #1f2833;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2c3540;
        }

        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .status-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-tag.pendente { background-color: rgba(255,165,0,0.2); color: #ffa500; }
        .status-tag.concluido { background-color: rgba(0,255,102,0.2); color: #00ff66; }
        .status-tag.efetivado { background-color: rgba(189,0,255,0.2); color: #bd00ff; }
        .status-tag.cancelado { background-color: rgba(255,77,77,0.2); color: #ff4d4d; }

        .item-linha {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 6px;
        }

        .pedido-footer {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-acao-container {
            display: flex;
            gap: 10px;
        }

        .btn-cancelar {
            background-color: rgba(255,77,77,0.1);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cancelar:hover { background-color: #ff4d4d; color: black; }
    </style>
</head>
<body>

    <div class="header-area">
        <a href="catalogo.html" class="btn-voltar">← Voltar para o Catálogo</a>
        <h2>📦 Meus Pedidos</h2>
    </div>

    <div class="login-box">
        <input type="email" id="busca-email" placeholder="Digite seu e-mail para verificar seus pedidos...">
        <button id="btn-buscar">Buscar</button>
    </div>

    <div class="pedidos-lista" id="lista-container">
        <p style="text-align: center; color: #666;">Digite seu e-mail acima para listar seu histórico.</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "comprasmk-241ae.firebaseapp.com",
            databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
            projectId: "comprasmk-241ae",
            storageBucket: "comprasmk-241ae.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let todosPedidos = {};
        const container = document.getElementById("lista-container");
        const btnBuscar = document.getElementById("btn-buscar");
        const inputEmail = document.getElementById("busca-email");

        btnBuscar.addEventListener("click", () => {
            const email = inputEmail.value.trim().toLowerCase();
            if(!email || !email.includes("@")) {
                alert("Insira um e-mail válido.");
                return;
            }

            onValue(ref(db, "pedidos"), (snapshot) => {
                if(snapshot.exists()) {
                    todosPedidos = snapshot.val();
                    renderizarPedidosDoCliente(email);
                } else {
                    container.innerHTML = "<p style='text-align: center; color:#666;'>Nenhum registro encontrado.</p>";
                }
            });
        });

        function renderizarPedidosDoCliente(emailCliente) {
            container.innerHTML = "";
            let filtrados = Object.keys(todosPedidos).filter(id => todosPedidos[id].email && todosPedidos[id].email.toLowerCase() === emailCliente).reverse();

            if(filtrados.length === 0) {
                container.innerHTML = "<p style='text-align: center; color:#aaa;'>Nenhum pedido localizado para este e-mail.</p>";
                return;
            }

            filtrados.forEach(id => {
                const ped = todosPedidos[id];
                const card = document.createElement("div");
                card.className = "card-pedido";

                let htmlItens = "";
                if(ped.itens) {
                    Object.keys(ped.itens).forEach(k => {
                        const it = ped.itens[k];
                        htmlItens += `<div class="item-linha">🛍️ <b>${it.quantidade}x</b> ${it.nome}</div>`;
                    });
                }

                // CONTROLE DE BOTÕES RÍGIDO: Só cria botões se o status for perfeitamente "pendente"
                let botoesHTML = "";
                if(ped.status === "pendente") {
                    botoesHTML = `
                        <div class="btn-acao-container">
                            <button class="btn-cancelar" onclick="cancelarMeuPedido('${id}')">❌ Cancelar Pedido</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="pedido-header">
                        <div>
                            <span style="font-size: 12px; color: #aaa;">Data: ${ped.data || ''}</span><br>
                            <span style="font-size: 11px; color: #666;">ID: ${id}</span>
                        </div>
                        <span class="status-tag ${ped.status}">${ped.status}</span>
                    </div>
                    <div style="margin-bottom: 15px;">
                        ${htmlItens}
                    </div>
                    <div class="pedido-footer">
                        <span style="color:#00ff66; font-weight:bold; font-size:18px;">Total: R$ ${parseFloat(ped.total).toFixed(2).replace('.',',')}</span>
                        ${botoesHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- SISTEMA ATÔMICO DE CANCELAMENTO PELO CLIENTE (DEVOLVE ESTOQUE) ---
        window.cancelarMeuPedido = async function(id) {
            const pedido = todosPedidos[id];
            if(!pedido) return;

            // Dupla verificação de proteção em tempo real antes de rodar o código
            if(pedido.status !== "pendente") {
                alert("Este pedido mudou de status recentemente e não pode mais ser cancelado.");
                return;
            }

            if(confirm("Tem certeza que deseja cancelar definitivamente este pedido? Seus itens retornarão ao estoque comercial.")) {
                if(pedido.itens) {
                    for (const k of Object.keys(pedido.itens)) {
                        const item = pedido.itens[k];
                        const estoqueRef = ref(db, `produtos/${k}/estoque`);

                        await runTransaction(estoqueRef, (atual) => {
                            if(atual === null) return atual;
                            return atual + parseInt(item.quantidade);
                        });
                    }
                }

                await update(ref(db, `pedidos/${id}`), { status: "cancelado" });
                alert("Pedido cancelado com sucesso!");
            }
        };
    </script>
</body>
</html>
