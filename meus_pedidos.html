<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-voltar {
            text-decoration: none;
            color: #ffffff;
            background-color: #1f2833;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #333;
            margin-bottom: 30px;
            align-self: flex-start;
            transition: background 0.2s;
        }
        .btn-voltar:hover { background-color: #2c3540; }
        h1 { color: #00d2ff; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .pedido-card { background-color: #1f2833; border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-left: 5px solid #00d2ff; }
        .pedido-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .pedido-data { font-size: 14px; color: #aaaaaa; display: flex; align-items: center; gap: 8px; }
        
        .status-badge { padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-pendente { background-color: rgba(255, 165, 0, 0.15); color: #ffa500; border: 1px solid #ffa500; }
        .status-concluido { background-color: rgba(0, 255, 102, 0.15); color: #00ff66; border: 1px solid #00ff66; }
        .status-cancelado { background-color: rgba(255, 77, 77, 0.15); color: #ff4d4d; border: 1px solid #ff4d4d; }

        .pedido-itens { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .item-linha { font-size: 15px; color: #ffffff; display: flex; align-items: center; gap: 10px; }
        .item-qtd { color: #00d2ff; font-weight: bold; }
        
        .pedido-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2d3748; padding-top: 12px; }
        .pedido-total { font-size: 16px; font-weight: bold; color: #aaaaaa; }
        .pedido-total span { color: #00ff66; font-size: 18px; }
        
        .btn-usuario-cancelar {
            background-color: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .btn-usuario-cancelar:hover { background-color: #ff4d4d; color: #ffffff; }
        #loading-text { color: #aaaaaa; text-align: center; font-style: italic; }
    </style>
</head>
<body>

    <a href="catalogo.html" class="btn-voltar">← Voltar para o Catálogo</a>

    <h1>📦 Meus Pedidos</h1>

    <div class="container" id="pedidos-container">
        <p id="loading-text">Carregando histórico de pedidos...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "comprasmk-241ae.firebaseapp.com",
            databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
            projectId: "comprasmk-241ae",
            storageBucket: "comprasmk-241ae.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const pedidosContainer = document.getElementById("pedidos-container");
        let pedidosLocais = {};

        onValue(ref(db, "pedidos"), (snapshot) => {
            if (snapshot.exists()) {
                pedidosContainer.innerHTML = "";
                pedidosLocais = snapshot.val();
                
                const listaPedidos = Object.keys(pedidosLocais).map(id => ({
                    id: id,
                    ...pedidosLocais[id]
                })).reverse();

                listaPedidos.forEach((pedido) => {
                    const card = document.createElement("div");
                    card.className = "pedido-card";

                    let classeStatus = "status-pendente";
                    if(pedido.status === "concluido") classeStatus = "status-concluido";
                    if(pedido.status === "cancelado") classeStatus = "status-cancelado";

                    const textoStatus = pedido.status || "pendente";

                    let htmlItens = "";
                    if (pedido.itens) {
                        Object.keys(pedido.itens).forEach((itemKey) => {
                            const item = pedido.itens[itemKey];
                            const nomeProduto = item.nome || itemKey;
                            const quantidade = item.quantidade || 1;
                            htmlItens += `
                                <div class="item-linha">
                                    🛍️ <span class="item-qtd">${quantidade}x</span> ${nomeProduto}
                                </div>
                            `;
                        });
                    }

                    const valorTotal = pedido.total ? pedido.total.toFixed(2).replace('.', ',') : "0,00";

                    // O próprio usuário pode cancelar caso esteja como pendente
                    const htmlBotaoCancelar = (pedido.status === "pendente" || !pedido.status) 
                        ? `<button class="btn-usuario-cancelar" onclick="clienteCancelarPedido('${pedido.id}')">Cancelar Pedido</button>` 
                        : ``;

                    card.innerHTML = `
                        <div class="pedido-header">
                            <div class="pedido-data">📅 ${pedido.data || 'Data não registrada'}</div>
                            <div class="status-badge ${classeStatus}">${textoStatus}</div>
                        </div>
                        <div class="pedido-itens">
                            ${htmlItens}
                        </div>
                        <div class="pedido-footer">
                            <div class="pedido-total">Total: <span>R$ ${valorTotal}</span></div>
                            ${htmlBotaoCancelar}
                        </div>
                    `;
                    pedidosContainer.appendChild(card);
                });
            } else {
                pedidosContainer.innerHTML = "<p id='loading-text'>Você ainda não realizou nenhum pedido.</p>";
            }
        });

        window.clienteCancelarPedido = async function(pedidoId) {
            const pedido = pedidosLocais[pedidoId];
            if (!pedido) return;

            if (confirm("Deseja mesmo cancelar este pedido?")) {
                try {
                    if (pedido.itens) {
                        for (const itemKey of Object.keys(pedido.itens)) {
                            const item = pedido.itens[itemKey];
                            const qtdParaDevolver = item.quantidade || 1;
                            const produtoId = item.id || itemKey;
                            
                            const estoqueRef = ref(db, `produtos/${produtoId}/estoque`);
                            
                            // Devolve os itens somando ao inventário atual de forma segura
                            await runTransaction(estoqueRef, (currentEstoque) => {
                                if (currentEstoque === null) return currentEstoque;
                                return currentEstoque + qtdParaDevolver;
                            });
                        }
                    }

                    await update(ref(db, `pedidos/${pedidoId}`), { status: "cancelado" });
                    alert("Seu pedido foi cancelado com sucesso!");

                } catch (error) {
                    console.error("Erro ao cancelar o pedido:", error);
                    alert("Erro técnico ao processar cancelamento.");
                }
            }
        };
    </script>
</body>
</html>
