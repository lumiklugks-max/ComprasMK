<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-area {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #1f2833;
            padding-bottom: 15px;
        }

        .btn-voltar {
            background-color: #1f2833;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #333;
        }

        .info-usuario-titulo {
            font-size: 14px;
            color: #00d2ff;
            background-color: rgba(0, 210, 255, 0.05);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #00d2ff22;
        }

        .pedidos-lista {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-pedido {
            background-color: #1f2833;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2c3540;
        }

        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .status-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-tag.pendente { background-color: rgba(255,165,0,0.2); color: #ffa500; }
        .status-tag.concluido { background-color: rgba(0,255,102,0.2); color: #00ff66; }
        .status-tag.efetivado { background-color: rgba(189,0,255,0.2); color: #bd00ff; }
        .status-tag.cancelado { background-color: rgba(255,77,77,0.2); color: #ff4d4d; }

        .item-linha {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 8px;
        }

        .pedido-footer {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-acao-container {
            display: flex;
            gap: 10px;
        }

        .btn-cancelar {
            background-color: rgba(255,77,77,0.1);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-cancelar:hover { background-color: #ff4d4d; color: black; }

        .btn-editar {
            background-color: rgba(255, 165, 0, 0.1);
            color: #ffa500;
            border: 1px solid #ffa500;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-editar:hover { background-color: #ffa500; color: black; }

        button:disabled {
            opacity: 0.4 !important;
            cursor: not-allowed !important;
        }
    </style>
</head>
<body>

    <div class="header-area">
        <a href="catalogo.html" class="btn-voltar">← Voltar para o Catálogo</a>
        <span class="info-usuario-titulo" id="perfil-email">Carregando perfil...</span>
        <h2>📦 Meus Pedidos</h2>
    </div>

    <div class="pedidos-lista" id="lista-container">
        <p style="text-align: center; color: #666;">Verificando banco de dados...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, runTransaction, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "comprasmk-241ae.firebaseapp.com",
            databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
            projectId: "comprasmk-241ae",
            storageBucket: "comprasmk-241ae.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let todosPedidos = {};
        let executandoAcao = false; 
        let emailSessaoLogado = "";

        const container = document.getElementById("lista-container");
        const txtPerfilEmail = document.getElementById("perfil-email");

        // --- TRAVA DE SEGURANÇA EXCLUSIVA COM BASE NA AUTENTICAÇÃO ---
        if(localStorage.getItem("email_logado")) {
            emailSessaoLogado = localStorage.getItem("email_logado").trim().toLowerCase();
            txtPerfilEmail.innerText = `Histórico de: ${emailSessaoLogado}`;
            ouvirPedidosDoBanco(emailSessaoLogado);
        } else {
            txtPerfilEmail.innerText = "Sessão inválida";
            txtPerfilEmail.style.color = "#ff4d4d";
            container.innerHTML = "<p style='text-align: center; color:#ff4d4d; font-weight:bold;'>Erro de Autenticação. Faça login novamente.</p>";
        }

        function ouvirPedidosDoBanco(emailCliente) {
            onValue(ref(db, "pedidos"), (snapshot) => {
                if(snapshot.exists()) {
                    todosPedidos = snapshot.val();
                    renderizarPedidosDoCliente(emailCliente);
                } else {
                    container.innerHTML = "<p style='text-align: center; color:#666;'>Nenhum registro encontrado no sistema.</p>";
                }
            });
        }

        function renderizarPedidosDoCliente(emailCliente) {
            container.innerHTML = "";
            
            // Filtra os pedidos estritamente vinculados ao e-mail coletado do login
            let filtrados = Object.keys(todosPedidos).filter(id => todosPedidos[id].email && todosPedidos[id].email.toLowerCase() === emailCliente).reverse();

            if(filtrados.length === 0) {
                container.innerHTML = "<p style='text-align: center; color:#aaa;'>Você ainda não realizou nenhum pedido com esta conta.</p>";
                return;
            }

            filtrados.forEach(id => {
                const ped = todosPedidos[id];
                const card = document.createElement("div");
                card.className = "card-pedido";

                let htmlItens = "";
                if(ped.itens) {
                    Object.keys(ped.itens).forEach(k => {
                        const it = ped.itens[k];
                        htmlItens += `<div class="item-linha">🔷 <b>${it.quantidade}x</b> ${it.nome}</div>`;
                    });
                }

                let botoesHTML = "";
                if(ped.status === "pendente") {
                    botoesHTML = `
                        <div class="btn-acao-container">
                            <button class="btn-editar" data-id="${id}" onclick="editarMeuPedido('${id}', this)">✏️ Editar Pedido</button>
                            <button class="btn-cancelar" data-id="${id}" onclick="cancelarMeuPedido('${id}', this)">❌ Cancelar</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="pedido-header">
                        <div>
                            <span style="font-size: 13px; color: #aaa;">Data: ${ped.data || ''}</span><br>
                            <span style="font-size: 11px; color: #666;">ID: ${id}</span>
                        </div>
                        <span class="status-tag ${ped.status}">${ped.status}</span>
                    </div>
                    <div style="margin-bottom: 15px;">
                        ${htmlItens}
                    </div>
                    <div class="pedido-footer">
                        <span style="color:#00ff66; font-weight:bold; font-size:18px;">Total: R$ ${parseFloat(ped.total).toFixed(2).replace('.',',')}</span>
                        ${botoesHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- SISTEMA BLINDADO DE EDIÇÃO ---
        window.editarMeuPedido = async function(id, btn) {
            if(executandoAcao) return;

            const snapValidacao = await get(ref(db, `pedidos/${id}/status`));
            if(!snapValidacao.exists() || snapValidacao.val() !== "pendente") {
                alert("Este pedido mudou de estado e não está mais disponível para alteração.");
                return;
            }

            if(confirm("Deseja reabrir este pedido? Seus itens retornarão ao catálogo e este registro pendente será arquivado.")) {
                executandoAcao = true;
                btn.disabled = true;

                const pedido = todosPedidos[id];
                let listaItensRecuperados = [];

                if(pedido && pedido.itens) {
                    for (const k of Object.keys(pedido.itens)) {
                        const item = pedido.itens[k];
                        const estoqueRef = ref(db, `produtos/${k}/estoque`);

                        await runTransaction(estoqueRef, (atual) => {
                            if(atual === null) return atual;
                            return atual + parseInt(item.quantidade);
                        });

                        listaItensRecuperados.push({
                            id: k,
                            nome: item.nome,
                            preco: parseFloat(item.precoUnitario || 0),
                            quantidade: parseInt(item.quantidade)
                        });
                    }
                }

                localStorage.setItem("carrinho_recuperado", JSON.stringify(listaItensRecuperados));
                await update(ref(db, `pedidos/${id}`), { status: "cancelado" });

                alert("Itens enviados para o seu carrinho! Você será enviado ao catálogo para alterá-los.");
                window.location.href = "catalogo.html";
            }
        };

        // --- SISTEMA BLINDADO DE CANCELAMENTO ---
        window.cancelarMeuPedido = async function(id, btn) {
            if(executandoAcao) return;

            const snapValidacao = await get(ref(db, `pedidos/${id}/status`));
            if(!snapValidacao.exists() || snapValidacao.val() !== "pendente") {
                alert("O pedido já foi faturado ou modificado pelo administrador!");
                return;
            }

            if(confirm("Tem certeza que deseja cancelar este pedido? Seus itens retornarão ao estoque comercial.")) {
                executandoAcao = true;
                btn.disabled = true;

                const pedido = todosPedidos[id];
                if(pedido && pedido.itens) {
                    for (const k of Object.keys(pedido.itens)) {
                        const item = pedido.itens[k];
                        const estoqueRef = ref(db, `produtos/${k}/estoque`);

                        await runTransaction(estoqueRef, (atual) => {
                            if(atual === null) return atual;
                            return atual + parseInt(item.quantidade);
                        });
                    }
                }

                await update(ref(db, `pedidos/${id}`), { status: "cancelado" });
                alert("Pedido cancelado com sucesso!");
                executandoAcao = false;
            }
        };
    </script>
</body>
</html>
