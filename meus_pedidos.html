<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-voltar {
            text-decoration: none;
            color: #ffffff;
            background-color: #1f2833;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #333;
            margin-bottom: 30px;
            align-self: flex-start;
            transition: background 0.2s;
        }
        .btn-voltar:hover {
            background-color: #2c3540;
        }
        h1 {
            color: #00d2ff;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .pedido-card {
            background-color: #1f2833;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-left: 5px solid #00d2ff;
        }
        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .pedido-data {
            font-size: 14px;
            color: #aaaaaa;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-pendente {
            background-color: rgba(255, 165, 0, 0.15);
            color: #ffa500;
            border: 1px solid #ffa500;
        }
        .status-concluido {
            background-color: rgba(0, 255, 102, 0.15);
            color: #00ff66;
            border: 1px solid #00ff66;
        }
        .pedido-itens {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .item-linha {
            font-size: 15px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .item-qtd {
            color: #00d2ff;
            font-weight: bold;
        }
        .pedido-total {
            font-size: 16px;
            font-weight: bold;
            text-align: right;
            color: #aaaaaa;
        }
        .pedido-total span {
            color: #00ff66;
            font-size: 18px;
        }
        #loading-text {
            color: #aaaaaa;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <a href="catalogo.html" class="btn-voltar">← Voltar para o Catálogo</a>

    <h1>📦 Meus Pedidos</h1>

    <div class="container" id="pedidos-container">
        <p id="loading-text">Carregando histórico de pedidos...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // IMPORTANTE: Insira aqui as mesmas chaves de conexão que usou no catalogo.html
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "comprasmk-241ae.firebaseapp.com",
            databaseURL: "https://comprasmk-241ae-default-rtdb.firebaseio.com",
            projectId: "comprasmk-241ae",
            storageBucket: "comprasmk-241ae.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const pedidosContainer = document.getElementById("pedidos-container");

        // ESCUTA A LISTA DE PEDIDOS DO BANCO EM TEMPO REAL
        onValue(ref(db, "pedidos"), (snapshot) => {
            if (snapshot.exists()) {
                pedidosContainer.innerHTML = "";
                const pedidosObj = snapshot.val();
                
                // Transforma em array e ordena para mostrar os mais recentes primeiro
                const listaPedidos = Object.keys(pedidosObj).map(id => ({
                    id: id,
                    ...pedidosObj[id]
                })).reverse();

                listaPedidos.forEach((pedido) => {
                    const card = document.createElement("div");
                    card.className = "pedido-card";

                    // Define a classe do badge baseado no status do pedido
                    const classeStatus = pedido.status === "concluido" ? "status-concluido" : "status-pendente";
                    const textoStatus = pedido.status || "pendente";

                    // Renderiza a lista de itens dinâmica de forma segura
                    let htmlItens = "";
                    if (pedido.itens) {
                        Object.keys(pedido.itens).forEach((itemKey) => {
                            const item = pedido.itens[itemKey];
                            
                            // Se o item for um objeto estruturado com .nome, usa ele. Caso contrário, tenta o fallback do formato antigo.
                            const nomeProduto = item.nome || itemKey;
                            const quantidade = item.quantidade || 1;

                            htmlItens += `
                                <div class="item-linha">
                                    🛍️ <span class="item-qtd">${quantidade}x</span> ${nomeProduto}
                                </div>
                            `;
                        });
                    }

                    // Formatação do preço total do card
                    const valorTotal = pedido.total ? pedido.total.toFixed(2).replace('.', ',') : "0,00";

                    card.innerHTML = `
                        <div class="pedido-header">
                            <div class="pedido-data">📅 ${pedido.data || 'Data não registrada'}</div>
                            <div class="status-badge ${classeStatus}">${textoStatus}</div>
                        </div>
                        <div class="pedido-itens">
                            ${htmlItens}
                        </div>
                        <div class="pedido-total">
                            Total: <span>R$ ${valorTotal}</span>
                        </div>
                    `;
                    pedidosContainer.appendChild(card);
                });
            } else {
                pedidosContainer.innerHTML = "<p id='loading-text'>Você ainda não realizou nenhum pedido.</p>";
            }
        });
    </script>
</body>
</html>
